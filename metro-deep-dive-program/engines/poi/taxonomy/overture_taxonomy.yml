effective_date: 2026-09-11
# Encodes taxonomy_category_layer_v1.md and taxonomy_sub_category_layer_v1.md.
# Category and sub_category names are verbatim from those documents and are
# stable identifiers: renaming one is a breaking change for Q4.
#
# Grain is source_category_basic, as the v1 docs assign. Rows the docs mark [T]
# carry a `split` block keyed on source_taxonomy_primary; the split wins over
# the row default. Rows the docs mark [U] use sub_category "Unspecified".
#
# Validate with: validate_taxonomy_rules.py --market richmond_va

defaults:
  unclassified_category: Unclassified
  unspecified_sub_category: Unspecified

