# Overture Places baseline used by the first POI Engine acquisition slice.
# Market identity and boundary vintage are resolved at run time by the Geography
# Engine; no market bbox is stored here as an alternate geography authority.
source_system: overture
source_dataset: places
# Overture keeps only recent releases public. 2026-06-17.0 (pilot) and
# 2026-08-19.0 (Richmond and Jacksonville Epic 2 runs) are gone; their caches
# and manifests remain the audit record. Bumped 2026-10-22 for the Albany run.
source_release: "2026-10-21.0"
source_path: "s3://overturemaps-us-west-2/release/2026-10-21.0/theme=places/type=place/*"
query_method: bbox_prefilter_then_governed_boundary_intersection
markets:
  richmond_va:
    market_id: "40060"
  jacksonville_fl:
    market_id: "27260"
  albany_ny:
    market_id: "10580"
  # NY statewide build, see issues/ny_state/NY_STATEWIDE_DATA_BUILD_PLAN.md.
  # Largest first, so a scale problem appears before the small markets run.
