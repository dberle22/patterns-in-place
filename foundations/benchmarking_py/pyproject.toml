[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pip-benchmarking"
version = "0.1.0"
description = "Reusable DuckDB-backed benchmarking helpers for Patterns in Place"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "pandas>=2,<3",
]

[tool.setuptools.packages.find]
include = ["pip_benchmarking*"]
