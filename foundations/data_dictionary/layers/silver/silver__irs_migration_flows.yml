lineage:
  - step: ingest_source
    script: foundations/etl/staging/get_irs_migration.R
    details: Downloads annual IRS county inflow CSVs, normalizes county and state inflow staging tables, converts suppressed negative measures to nulls, and scales AGI into dollars.
  - step: enrich_and_write
    script: foundations/etl/silver/irs_migration_silver.R
    details: Joins county and state naming metadata, deduplicates exact staging repeats, and writes combined county/state origin-destination flows to silver.irs_migration_flows.
