table_name: irs_migration_flows
schema: silver
grain: One row per geo_level + origin_geo_id + dest_geo_id + year (inferred).
primary_key:
  - geo_level
  - origin_geo_id
  - dest_geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2012'
  max: '2022'
geo_coverage:
  notes:
    - distinct_geo_levels=2
    - distinct_origin_geo_id=3115
    - distinct_dest_geo_id=3141
columns:
  - name: geo_level
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 2
    min_value: ~
    max_value: ~
    min_length: 5
    max_length: 6
    top_values:
      - value: county
        count: 626175
      - value: state
        count: 28050
    definition: Geographic level shared by the origin and destination IDs in the flow row (`county` or `state`).
    needs_confirmation: no
