table_name: bfs
schema: silver
grain: One row per geo_level + geo_id + period + series_code (annual county BFS business applications plus derived CBSA and state rollups).
primary_key:
  - geo_level
  - geo_id
  - period
  - series_code
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2005'
  max: '2024'
geo_coverage:
  notes:
    - county_rows=63120
    - cbsa_rows=18500
    - state_rows=1020
    - county_geo_ids=3156
    - cbsa_geo_ids=925
    - state_geo_ids=51
quality_notes:
  - Live key check on 2026-06-09 found zero duplicates on geo_level + geo_id + period + series_code.
  - The current BFS Silver contract is annual-only and series-limited to `BA`.
  - CBSA and state rows are derived from county rows after the county annual surface is standardized.
  - `value` and `business_applications` are identical in the current contract because the only staged series is `BA`.
  - `business_application_rate_per_1000_establishments` is only populated where the CBP all-sector denominator exists, which currently means `2010-2023`.
sources:
  - staging.bfs_county
  - silver.xwalk_cbsa_county
  - silver.xwalk_county_state
  - silver.cbp
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`county`, `cbsa`, or `state`). }
  - { name: geo_id, type: VARCHAR, definition: Geographic identifier for the row. County rows use 5-digit county FIPS, CBSA rows use 5-digit CBSA codes, and state rows use 2-digit state FIPS. }
  - { name: geo_name, type: VARCHAR, definition: Geographic display name for the row. County names are normalized from the county crosswalk, CBSA names come from the county-to-CBSA crosswalk, and state rows use USPS abbreviations. }
  - { name: period_type, type: VARCHAR, definition: Time-period type for the row. The current first-pass contract uses `annual` only. }
  - { name: period, type: INTEGER, definition: Analytical period identifier for the annual row, equal to the calendar year in the current contract. }
  - { name: year, type: INTEGER, definition: Calendar year of the BFS business-applications observation. }
  - { name: state_fips, type: VARCHAR, definition: Two-digit state FIPS helper carried on county and state rows. CBSA rows leave this null because CBSAs can span states. }
  - { name: state_abbr, type: VARCHAR, definition: USPS state abbreviation helper carried on county and state rows. CBSA rows leave this null because CBSAs can span states. }
  - { name: series_code, type: VARCHAR, definition: BFS series code for the row. The current first-pass contract uses `BA` only. }
  - { name: series_label, type: VARCHAR, definition: Human-readable BFS series label for the row (`Business Applications`). }
  - { name: value, type: DOUBLE, definition: Generic BFS value field for the row. In the current annual-only contract this equals `business_applications`. }
  - { name: business_applications, type: DOUBLE, definition: Annual business-applications count for the geography-year row. }
  - { name: business_applications_yoy_pct, type: DOUBLE, definition: Year-over-year growth rate in annual business applications within the same geography and series. }
  - { name: cbp_total_estabs, type: DOUBLE, definition: CBP all-sector establishment denominator from `silver.cbp` when the annual year overlap exists. }
  - { name: business_application_rate_per_1000_establishments, type: DOUBLE, definition: Annual business applications per 1,000 CBP all-sector establishments. }
  - { name: source, type: VARCHAR, definition: Source system or provider for the row (`Census BFS`). }
lineage:
  - step: read_source
    script: foundations/etl/staging/get_bfs.R
    details: Downloads the annual county BFS workbook, pivots the `BA2005:BA2024` wide sheet long, and writes `staging.bfs_county`.
  - step: standardize_and_roll_up
    script: foundations/etl/silver/bfs_silver.R
    details: Standardizes county annual rows, derives CBSA and state annual sums, joins CBP all-sector establishments where available, and computes annual YoY and intensity fields.
  - step: write_target
    script: foundations/etl/silver/bfs_silver.R
    details: Writes `silver.bfs` with overwrite enabled after the uniqueness check passes.
kpi_definitions: []
