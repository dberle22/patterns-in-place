    needs_confirmation: no
  - name: industry_label
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 21
    min_value: ~
    max_value: ~
    min_length: ~
    max_length: ~
    top_values: []
    definition: Human-readable label for `industry_code`.
    needs_confirmation: no
