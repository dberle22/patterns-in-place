table_name: lehd_qwi
schema: silver
grain: One row per geo_level + geo_id + year + demo_family + demo_code + industry_code.
primary_key:
  - geo_level
  - geo_id
  - year
  - demo_family
  - demo_code
  - industry_code
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2007'
  max: '2025'
geo_coverage:
  notes:
    - geo_levels=county,cbsa,state,division,us
    - row_count=11387040
    - county_first_rollup=true
columns:
  - name: geo_level
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 5
    min_value: ~
    max_value: ~
    min_length: 2
    max_length: 8
    top_values: []
    definition: Geographic level for the row (`county`, `cbsa`, `state`, `division`, or `us`).
    needs_confirmation: no
  - name: geo_id
    type: VARCHAR
    null_pct: 0.0
    distinct_count: ~
    min_value: ~
    max_value: ~
    min_length: 1
    max_length: 5
    top_values: []
    definition: Geographic identifier for the row.
    needs_confirmation: no
  - name: geo_name
    type: VARCHAR
    null_pct: 0.0
    distinct_count: ~
    min_value: ~
    max_value: ~
    min_length: ~
    max_length: ~
    top_values: []
    definition: Geographic display name for the row.
    needs_confirmation: no
  - name: year
    type: INTEGER
    null_pct: 0.0
    distinct_count: 19
    min_value: 2007
    max_value: 2025
    min_length: ~
    max_length: ~
    top_values: []
    definition: Observation year for the annualized QWI row.
    needs_confirmation: no
  - name: state_fips
    type: VARCHAR
    null_pct: ~
    distinct_count: ~
    min_value: ~
    max_value: ~
    min_length: 2
    max_length: 2
    top_values: []
    definition: State FIPS code for county and state rows; null for aggregate non-state geographies.
    needs_confirmation: no
  - name: state_abbr
    type: VARCHAR
    null_pct: ~
    distinct_count: ~
    min_value: ~
    max_value: ~
    min_length: 2
    max_length: 2
    top_values: []
    definition: State abbreviation for county and state rows; null for aggregate non-state geographies.
    needs_confirmation: no
  - name: demo_family
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 2
    min_value: ~
    max_value: ~
    min_length: 3
    max_length: 9
    top_values: []
    definition: Demographic family represented by the row (`age` or `education`).
    needs_confirmation: no
  - name: demo_code
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 14
    min_value: ~
    max_value: ~
    min_length: 2
    max_length: 3
    top_values: []
    definition: LEHD demographic code for the row's age or education bucket.
    needs_confirmation: no
  - name: demo_label
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 14
    min_value: ~
    max_value: ~
    min_length: ~
    max_length: ~
    top_values: []
    definition: Human-readable label for `demo_code`.
    needs_confirmation: no
  - name: demo_sort_order
    type: INTEGER
    null_pct: 0.0
    distinct_count: 9
    min_value: 0
    max_value: 8
    min_length: ~
    max_length: ~
    top_values: []
    definition: Stable sort order for the demographic code within its family.
    needs_confirmation: no
  - name: is_total_demo
    type: BOOLEAN
    null_pct: 0.0
    distinct_count: 2
    min_value: ~
    max_value: ~
    min_length: ~
    max_length: ~
    top_values: []
    definition: Whether the demographic code is the all-category total row within its family.
    needs_confirmation: no
  - name: industry_code
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 21
    min_value: ~
    max_value: ~
    min_length: 2
    max_length: 5
    top_values: []
