table_name: bea_cainc5n
schema: silver
grain: One row per geo_level + geo_id + period + industry_key in the curated CAINC5N broad-industry contract.
primary_key:
  - geo_level
  - geo_id
  - period
  - industry_key
foreign_keys: []
time_coverage:
  type: range
  column: period
  min: '2001'
  max: '2023'
geo_coverage:
  notes:
    - geo_levels=county,cbsa,state,us
    - county_and_cbsa_rows_are_additive_dollar_rollups
    - row_count=1416915
columns:
  - name: geo_level
    type: VARCHAR
    definition: Geographic level for the row (`county`, `cbsa`, `state`, or `us`).
    needs_confirmation: no
  - name: geo_id
    type: VARCHAR
    definition: Geographic identifier for the row. County rows use 5-digit county FIPS, CBSA rows use CBSA codes, state rows use 2-digit state FIPS, and the U.S. row uses `1`.
    needs_confirmation: no
  - name: geo_name
    type: VARCHAR
    definition: Geographic display name for the row.
    needs_confirmation: no
  - name: period
    type: INTEGER
    definition: Calendar year for the annual CAINC5N observation.
    needs_confirmation: no
  - name: table
    type: VARCHAR
    definition: Source BEA table code. This contract currently materializes only `CAINC5N`.
    needs_confirmation: no
  - name: industry_key
    type: VARCHAR
    definition: Stable curated industry bucket identifier such as `all_industries`, `private_nonfarm`, `manufacturing`, or `public_admin`.
    needs_confirmation: no
  - name: industry_label
    type: VARCHAR
    definition: Human-readable label for the curated industry bucket.
    needs_confirmation: no
  - name: industry_rollup_family
    type: VARCHAR
    definition: Broad cross-source industry family used for downstream alignment in Gold.
    needs_confirmation: no
  - name: industry_rollup_level
    type: VARCHAR
    definition: Contract level for the row, currently `total`, `published_total`, or `broad_family`.
    needs_confirmation: no
  - name: naics_raw
    type: VARCHAR
    definition: Source-adjacent NAICS code or code range associated with the curated industry bucket when one exists.
    needs_confirmation: no
  - name: source_line_codes
    type: VARCHAR
    definition: Comma-delimited BEA CAINC5N line codes used to build the curated row.
    needs_confirmation: no
  - name: earnings_total
    type: DOUBLE
    definition: Earnings total for the curated bucket. Broad industry rows use published earnings lines; the `all_industries` row uses BEA line `35` earnings by place of work.
    needs_confirmation: no
  - name: compensation_total
    type: DOUBLE
    definition: Derived all-industries compensation total equal to `wages_salaries + supplements`. Populated only on the `all_industries` row because CAINC5N does not publish parallel industry-detail compensation rows.
    needs_confirmation: no
  - name: wages_salaries
    type: DOUBLE
    definition: All-industries wages and salaries from BEA line `50`. Null on the broad industry rows.
    needs_confirmation: no
  - name: supplements
    type: DOUBLE
    definition: All-industries supplements to wages and salaries from BEA line `60`. Null on the broad industry rows.
    needs_confirmation: no
  - name: pension_insurance_supplements
    type: DOUBLE
    definition: All-industries employer contributions for employee pension and insurance funds from BEA line `61`.
    needs_confirmation: no
  - name: govt_social_insurance_supplements
    type: DOUBLE
    definition: All-industries employer contributions for government social insurance from BEA line `62`.
    needs_confirmation: no
  - name: proprietors_income
    type: DOUBLE
    definition: All-industries proprietors' income from BEA line `70`.
    needs_confirmation: no
  - name: has_source_suppression
    type: BOOLEAN
    definition: Whether any contributing staged source line for the row was suppressed by BEA.
    needs_confirmation: no
  - name: earnings_total_note_ref
    type: VARCHAR
    definition: Source note reference attached to the retained earnings line(s), when present.
    needs_confirmation: no
  - name: wages_salaries_note_ref
    type: VARCHAR
    definition: Source note reference attached to the wages-and-salaries line, when present.
    needs_confirmation: no
  - name: supplements_note_ref
    type: VARCHAR
    definition: Source note reference attached to the supplements line, when present.
    needs_confirmation: no
  - name: pension_insurance_supplements_note_ref
    type: VARCHAR
    definition: Source note reference attached to the pension-and-insurance supplements line, when present.
    needs_confirmation: no
  - name: govt_social_insurance_supplements_note_ref
    type: VARCHAR
    definition: Source note reference attached to the government social insurance supplements line, when present.
    needs_confirmation: no
  - name: proprietors_income_note_ref
    type: VARCHAR
    definition: Source note reference attached to the proprietors' income line, when present.
    needs_confirmation: no
