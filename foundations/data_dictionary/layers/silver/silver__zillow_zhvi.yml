table_name: zillow_zhvi
schema: silver
grain: One row per geo_level + geo_id + period (monthly Zillow home-value series).
primary_key:
  - geo_level
  - geo_id
  - period
foreign_keys: []
time_coverage:
  type: range
  column: period
  min: '2016-01-31'
  max: '2025-10-31'
geo_coverage:
  notes:
    - distinct_geo_levels=3
    - distinct_geo_id=28783
    - cbsa_rows=108239
    - county_rows=356229
    - zcta_rows=2940134
columns:
  - name: geo_level
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 3
    min_length: 4
    max_length: 6
    top_values:
      - value: zcta
        count: 4683002
      - value: county
        count: 546994
      - value: cbsa
        count: 163404
    definition: Geographic level for the Zillow observation row (`county`, `zcta`, or `cbsa`).
    needs_confirmation: no
  - name: geo_id
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 28783
    min_length: 5
    max_length: 5
    definition: Geographic identifier for the observation row. County rows use 5-digit county FIPS, ZCTA rows use 5-digit ZIP Code tabulation area identifiers, and CBSA rows use 5-digit CBSA codes.
    needs_confirmation: no
  - name: geo_name
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 29065
    min_length: 7
    max_length: 46
    definition: Geographic display name for the observation row.
    needs_confirmation: no
  - name: period
    type: DATE
    null_pct: 0.0
    distinct_count: 118
    min_value: '2016-01-31'
    max_value: '2025-10-31'
    definition: Month-end observation date for the Zillow series.
    needs_confirmation: no
  - name: year
    type: INTEGER
    null_pct: 0.0
    distinct_count: 10
    min_value: 2016
    max_value: 2025
    definition: Calendar year extracted from `period`.
    needs_confirmation: no
  - name: month
    type: INTEGER
    null_pct: 0.0
    distinct_count: 12
    min_value: 1
    max_value: 12
    definition: Calendar month number extracted from `period`.
    needs_confirmation: no
  - name: zhvi
    type: DOUBLE
    null_pct: 0.0
    distinct_count: 3341707
    min_value: 14141.35
    max_value: 8108365.0
    definition: Zillow Home Value Index monthly level for the geography and month.
    needs_confirmation: no
lineage:
  - step: read_source
    script: foundations/etl/staging/get_zillow.R
    details: Reads and pivots Zillow county and ZIP ZHVI CSVs into monthly staging tables.
  - step: transform_and_rebase
    script: foundations/etl/silver/zillow_silver.R
    details: Standardizes county and ZCTA rows, rebases county ZHVI rows to CBSA using `silver.xwalk_cbsa_county` and county `hu_totalE` weights from `silver.housing_base`, clamps the weight year to the available ACS range so 2025 Zillow months use 2024 housing totals, and keeps only non-null observations from 2016 forward.
  - step: write_target
    script: foundations/etl/silver/zillow_silver.R
    details: Writes `silver.zillow_zhvi` with overwrite enabled.
kpi_definitions: []
