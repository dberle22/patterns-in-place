table_name: epa_sld
schema: silver
grain: One row per geo_level + geo_id + year (county, CBSA, and state EPA Smart Location Database indicators aggregated from census block groups).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2021'
  max: '2021'
geo_coverage:
  notes:
    - distinct_geo_levels=3
    - county_rows=3232
    - cbsa_rows=928
    - state_rows=56
quality_notes:
  - The Silver build keeps county as the first modeled rollup off staging, then derives CBSA and state rows from that county base.
  - Canonical county IDs are derived directly from `state_fips + county_fips` and must resolve to `silver.xwalk_county_state` before Silver writes any rows.
  - CBSA rollups use `silver.xwalk_cbsa_county` and assume a one-county-to-one-CBSA mapping in the current crosswalk snapshot.
  - The delivered EPA CSV writes `GEOID10` and `GEOID20` in scientific notation, so staging reconstructs canonical block-group IDs from `STATEFP + COUNTYFP + TRACTCE + BLKGRPCE` instead of trusting the raw GEOID strings.
  - The first-pass county contract keeps the 8 legacy Connecticut county GEOIDs via an explicit manual name map so the 2021 SLD rows align with the 2021 ACS county transport contract. Alaska county-equivalent `02261` remains excluded because the current county crosswalk no longer carries that retired geography.
  - `population_density_gross`, `housing_density_gross`, and `employment_density_gross` are recomputed at each modeled geography from summed numerators and summed unprotected-land denominators rather than averaged from lower-grain density fields.
  - Remaining accessibility, mix, and index-style fields use documented weighted means across block groups.
  - Transit-related metrics have partial GTFS coverage by design, so the Silver contract carries coverage helpers to show what share of each geography's population had non-null block-group transit metrics.
sources:
  - staging.epa_sld
  - silver.xwalk_county_state
  - silver.xwalk_cbsa_county
  - silver.xwalk_state_region
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`county`, `cbsa`, or `state`). }
  - { name: geo_id, type: VARCHAR, definition: Canonical identifier within `geo_level` (county GEOID, CBSA code, or state FIPS). }
  - { name: geo_name, type: VARCHAR, definition: Canonical geography display name from the county, CBSA, or state crosswalk. }
  - { name: year, type: INTEGER, definition: EPA Smart Location Database vintage year. }
  - { name: state_abbr, type: VARCHAR, definition: State abbreviation where the row maps cleanly to a single state; multi-state CBSAs remain null. }
  - { name: total_population, type: DOUBLE, definition: Summed population across constituent block groups for the modeled geography. }
  - { name: total_employment, type: DOUBLE, definition: Summed employment across constituent block groups for the modeled geography. }
  - { name: housing_units, type: DOUBLE, definition: Summed housing units across constituent block groups for the modeled geography. }
  - { name: households, type: DOUBLE, definition: Summed households across constituent block groups for the modeled geography. }
  - { name: land_acres_unprotected, type: DOUBLE, definition: Summed unprotected land acreage used as the density denominator for the modeled geography. }
  - { name: block_group_count, type: INTEGER, definition: Number of staged block groups aggregated into the row. }
  - { name: block_group_count_transit_non_null, type: INTEGER, definition: Number of constituent block groups with non-null transit service density values. }
  - { name: block_group_count_walkability_non_null, type: INTEGER, definition: Number of constituent block groups with non-null walkability values. }
  - { name: transit_population_coverage_share, type: DOUBLE, definition: Share of geography population living in block groups with non-null transit metrics. }
  - { name: walkability_population_coverage_share, type: DOUBLE, definition: Share of geography population living in block groups with non-null walkability metrics. }
  - { name: walkability_index, type: DOUBLE, definition: Population-weighted walkability index aggregated from block-group `NatWalkInd`. }
  - { name: employment_housing_mix, type: DOUBLE, definition: Household-weighted employment and housing mix metric aggregated from `D2A_EPHHM`. }
  - { name: employment_mix, type: DOUBLE, definition: Employment-weighted employment diversity metric aggregated from `D2B_E8MIXA`. }
  - { name: street_intersection_density, type: DOUBLE, definition: Land-area-weighted pedestrian-oriented intersection density aggregated from `D3B`. }
  - { name: auto_oriented_intersection_share, type: DOUBLE, definition: Land-area-weighted auto-oriented network metric aggregated from `D3AAO`. }
  - { name: transit_service_density, type: DOUBLE, definition: Population-weighted transit service density aggregated from `D4B025`. }
  - { name: transit_frequency_peak, type: DOUBLE, definition: Population-weighted peak transit frequency aggregated from `D4D`. }
  - { name: distance_to_transit, type: DOUBLE, definition: Population-weighted distance-to-transit metric aggregated from `D4E`. }
  - { name: jobs_access_45min_transit, type: DOUBLE, definition: Population-weighted jobs-accessible-by-transit metric aggregated from `D5AR`. }
  - { name: workers_access_45min_transit, type: DOUBLE, definition: Population-weighted working-age-population-accessible-by-transit metric aggregated from `D5AE`. }
  - { name: jobs_access_45min_auto, type: DOUBLE, definition: Population-weighted jobs-accessible-by-auto metric aggregated from `D5BR`. }
  - { name: workers_access_45min_auto, type: DOUBLE, definition: Population-weighted working-age-population-accessible-by-auto metric aggregated from `D5BE`. }
  - { name: employment_density_gross, type: DOUBLE, definition: Employment density recomputed as total employment divided by total unprotected land area. }
  - { name: population_density_gross, type: DOUBLE, definition: Population density recomputed as total population divided by total unprotected land area. }
  - { name: housing_density_gross, type: DOUBLE, definition: Housing density recomputed as housing units divided by total unprotected land area. }
lineage:
  - step: read_source
    script: foundations/etl/staging/get_epa_sld.R
    details: Downloads the direct EPA SLD CSV, reconstructs canonical block-group GEOIDs from component geography fields, keeps the compact indicator subset plus `TotEmp`, and writes `staging.epa_sld`.
  - step: aggregate_to_modeled_geographies
    script: foundations/etl/silver/epa_sld_silver.R
    details: Resolves canonical county IDs through the county crosswalk, builds the county base from block groups, derives CBSA and state rows from that county base, recomputes exact density metrics at each geography, applies documented weighted means for remaining accessibility and index-like fields, and writes a unified Silver table.
  - step: write_target
    script: foundations/etl/silver/epa_sld_silver.R
    details: Writes `silver.epa_sld` with overwrite enabled after the county coverage audit, CBSA crosswalk audit, and uniqueness check pass.
kpi_definitions: []
