table_name: fhfa_hpi
schema: silver
grain: One row per geo_level + geo_id + year (annual FHFA house-price index series).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '1975'
  max: '2025'
geo_coverage:
  notes:
    - distinct_geo_levels=5
    - distinct_geo_id=22793
    - cbsa_rows=41392
    - county_rows=105195
    - state_rows=2601
    - us_rows=51
    - zcta_rows=670165
columns:
  - name: geo_level
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 5
    min_length: 2
    max_length: 6
    top_values:
      - value: zcta
        count: 670165
      - value: county
        count: 105195
      - value: cbsa
        count: 41392
      - value: state
        count: 2601
      - value: us
        count: 51
    definition: Geographic level for the FHFA observation row (`us`, `state`, `cbsa`, `county`, or ZIP5-as-`zcta`).
    needs_confirmation: no
  - name: geo_id
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 22793
    min_length: 2
    max_length: 5
    definition: Geographic identifier for the FHFA observation row. State rows use 2-digit state FIPS, county rows use 5-digit county FIPS, CBSA rows use 5-digit CBSA codes, ZCTA rows use 5-digit ZIP proxies, and the national row uses `US`.
    needs_confirmation: no
  - name: geo_name
    type: VARCHAR
    null_pct: 0.0
    distinct_count: 21954
    min_length: 2
    max_length: 72
    definition: Geographic display name for the FHFA observation row. CBSA and county names are normalized from crosswalk-backed metadata where available.
    needs_confirmation: no
  - name: year
    type: INTEGER
    null_pct: 0.0
    distinct_count: 51
    min_value: 1975
    max_value: 2025
    definition: Calendar year of the annual FHFA house-price observation.
    needs_confirmation: no
  - name: hpi_level
    type: DOUBLE
    null_pct: 0.0
    distinct_count: 758753
    min_value: 0.02
    max_value: 1934.48
    definition: FHFA annual HPI level using the source table's canonical `hpi` series rather than the helper rebases.
    needs_confirmation: no
  - name: hpi_yoy_pct
    type: DOUBLE
    null_pct: 3.7905
    distinct_count: 557378
    min_value: -0.4400366972477064
    max_value: 1.3505714285714285
    definition: Exact year-over-year growth rate in `hpi_level`, computed only when a prior `year - 1` observation exists for the same geography.
    needs_confirmation: no
  - name: hpi_5yr_pct
    type: DOUBLE
    null_pct: 14.3050
    distinct_count: 619415
    min_value: -0.6509708737864078
    max_value: 4.853219696969697
    definition: Five-year growth rate in `hpi_level`, computed only when a prior `year - 5` observation exists for the same geography.
    needs_confirmation: no
  - name: hpi_10yr_pct
    type: DOUBLE
    null_pct: 27.7644
    distinct_count: 590381
    min_value: -0.5242537313432836
    max_value: 11.571111111111112
    definition: Ten-year growth rate in `hpi_level`, computed only when a prior `year - 10` observation exists for the same geography.
    needs_confirmation: no
lineage:
  - step: read_source
    script: foundations/etl/staging/get_fhfa.R
    details: Downloads the annual FHFA national, state, CBSA, county, ZIP5, and tract files and writes source-faithful staging tables.
  - step: standardize_and_enrich
    script: foundations/etl/silver/fhfa_hpi_silver.R
    details: Keeps the first-pass analytical geography set (`us`, `state`, `cbsa`, `county`, and ZIP5-as-`zcta`), normalizes names with CBSA and county crosswalks, excludes FHFA non-CBSA residual rows from the CBSA workbook, and computes exact 1-year, 5-year, and 10-year growth metrics from annual `hpi` levels.
  - step: write_target
    script: foundations/etl/silver/fhfa_hpi_silver.R
    details: Writes `silver.fhfa_hpi` with overwrite enabled.
kpi_definitions: []
