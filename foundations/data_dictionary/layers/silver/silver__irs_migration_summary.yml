lineage:
  - step: stage_to_flow
    script: foundations/etl/staging/get_irs_migration.R
    details: Builds county-level inflow records plus interstate state inflow records that seed the Silver summary rollups.
  - step: summarize_and_write
    script: foundations/etl/silver/irs_migration_silver.R
    details: Aggregates county inflows and outflows, rebases county flows to CBSA while excluding within-CBSA moves, preserves state-level interstate summary rows, and writes silver.irs_migration_summary.
