table_name: irs_migration_summary
schema: silver
grain: One row per geo_level + geo_id + year (inferred).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2012'
  max: '2022'
geo_coverage:
  notes:
    - distinct_geo_levels=3
    - distinct_geo_id=4076
    - county_rows=31909
    - cbsa_rows=10105
    - state_rows=561
