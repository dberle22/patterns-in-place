table_name: chr_health_outcomes
schema: silver
grain: One row per geo_level + geo_id + year (county source rows plus derived CBSA rollups from CHR).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2016'
  max: '2025'
geo_coverage:
  notes:
    - distinct_geo_levels=2
    - distinct_geo_id=4084
    - county_rows=31423
    - cbsa_rows=9187
quality_notes:
  - Live key check on 2026-06-09 found zero duplicates on geo_level + geo_id + year.
  - County rows come from the curated annual historical staging panel, which intentionally excludes the staged national and state summary rows and keeps county plus county-equivalent observations only.
  - Provider access fields use CHR's published ratio helper columns (`population:provider`) rather than the paired per-100k raw values.
  - CBSA rows are derived with `silver.xwalk_cbsa_county` plus ACS `silver.age_kpi` weights: total population for most measures and school-age population for reading/math.
  - `air_pollution_pm25` and `adverse_climate_events` are intentional holdover fields pending direct EPA and FEMA source coverage in later tracks.
  - Several CHR measures were introduced after 2016, so older years legitimately carry structural nulls for newer columns such as `adverse_climate_events` and `pct_access_to_parks`.
sources:
  - staging.chr_health_rankings_history
  - silver.xwalk_cbsa_county
  - silver.xwalk_county_state
  - silver.age_kpi
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`county` or derived `cbsa`). }
  - { name: geo_id, type: VARCHAR, definition: Geographic identifier for the row. County rows use 5-digit county FIPS and CBSA rows use 5-digit CBSA codes. }
  - { name: geo_name, type: VARCHAR, definition: Geographic display name for the row. County names are normalized from the county crosswalk where available and CBSA names come from the county-to-CBSA crosswalk. }
  - { name: year, type: INTEGER, definition: CHR release year carried as the analytical observation year. }
  - { name: life_expectancy, type: DOUBLE, definition: Life Expectancy raw value from CHR. }
  - { name: premature_death_rate, type: DOUBLE, definition: Premature Death raw value from CHR, measured as years of potential life lost before age 75 per 100,000 population. }
  - { name: premature_age_adjusted_mortality, type: DOUBLE, definition: Premature Age-Adjusted Mortality raw value from CHR. }
  - { name: child_mortality_rate, type: DOUBLE, definition: Child Mortality raw value from CHR. }
  - { name: infant_mortality_rate, type: DOUBLE, definition: Infant Mortality raw value from CHR. }
  - { name: drug_overdose_death_rate, type: DOUBLE, definition: Drug Overdose Deaths raw value from CHR. }
  - { name: poor_mental_health_days, type: DOUBLE, definition: Poor Mental Health Days raw value from CHR, measured as the average number of mentally unhealthy days reported in the past 30 days. }
  - { name: adult_obesity, type: DOUBLE, definition: Adult Obesity raw value from CHR. }
  - { name: physical_inactivity, type: DOUBLE, definition: Physical Inactivity raw value from CHR. }
  - { name: pct_uninsured_adults, type: DOUBLE, definition: Uninsured Adults raw value from CHR. }
  - { name: primary_care_ratio, type: DOUBLE, definition: Published CHR ratio of population to primary care physicians. Lower values indicate better provider access. }
  - { name: mental_health_provider_ratio, type: DOUBLE, definition: Published CHR ratio of population to mental health providers. Lower values indicate better provider access. }
  - { name: preventable_hospital_stay_rate, type: DOUBLE, definition: Preventable Hospital Stays raw value from CHR. }
  - { name: food_insecurity_rate, type: DOUBLE, definition: Food Insecurity raw value from CHR. }
  - { name: social_associations_per_10k, type: DOUBLE, definition: Social Associations raw value from CHR, measured per 10,000 residents. }
  - { name: child_care_cost_burden_rate, type: DOUBLE, definition: Child Care Cost Burden raw value from CHR. }
  - { name: hs_graduation_rate, type: DOUBLE, definition: High School Graduation raw value from CHR. }
  - { name: air_pollution_pm25, type: DOUBLE, definition: Air Pollution: Particulate Matter raw value from CHR. This is a lagged holdover pending direct EPA AQI coverage. }
  - { name: adverse_climate_events, type: DOUBLE, definition: Adverse Climate Events raw value from CHR. This is a holdover field pending direct FEMA/environment coverage. }
  - { name: pct_access_to_parks, type: DOUBLE, definition: Access to Parks raw value from CHR. }
  - { name: homicide_rate, type: DOUBLE, definition: Homicides raw value from CHR. }
  - { name: firearm_fatality_rate, type: DOUBLE, definition: Firearm Fatalities raw value from CHR. }
  - { name: motor_vehicle_crash_rate, type: DOUBLE, definition: Motor Vehicle Crash Deaths raw value from CHR. }
  - { name: reading_score_index, type: DOUBLE, definition: Reading Scores raw value from CHR. CBSA rollups are weighted by school-age population. }
  - { name: math_score_index, type: DOUBLE, definition: Math Scores raw value from CHR. CBSA rollups are weighted by school-age population. }
lineage:
  - step: read_source
    script: foundations/etl/staging/get_chr.R
    details: Resolves annual CHR analytic CSV downloads for 2016-2025, preserves the source-faithful 2025 wide table, and materializes the curated county-only historical panel `staging.chr_health_rankings_history`.
  - step: standardize_and_rebase
    script: foundations/etl/silver/chr_silver.R
    details: Reads the curated historical county panel, standardizes the approved 25-measure CHR contract, normalizes county names from crosswalk metadata, and derives CBSA rows with county-to-CBSA crosswalk joins plus ACS population weights.
  - step: write_target
    script: foundations/etl/silver/chr_silver.R
    details: Writes `silver.chr_health_outcomes` with overwrite enabled.
kpi_definitions: []
