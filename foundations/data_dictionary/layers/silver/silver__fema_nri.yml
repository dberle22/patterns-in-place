table_name: fema_nri
schema: silver
grain: One row per geo_level + geo_id + year (county-equivalent FEMA NRI rows plus derived CBSA rollups).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2025'
  max: '2025'
geo_coverage:
  notes:
    - distinct_geo_levels=2
    - distinct_geo_id=4167
    - county_rows=3232
    - cbsa_rows=935
quality_notes:
  - Live key check on 2026-06-08 found zero duplicates on geo_level + geo_id + year.
  - County rows preserve FEMA's full county-equivalent coverage rather than filtering to literal `County` records, so parishes, municipios, boroughs, planning regions, and other county-equivalent designations remain in scope.
  - County `geo_id` uses FEMA `stcofips` after zero-padding and validation in staging; `nri_id` remains a source QA field rather than the canonical Silver key.
  - CBSA rows are derived from county-equivalent staging rows through `silver.xwalk_cbsa_county` using staged `population` as the first-pass weight for all promoted FEMA score and frequency fields.
  - The Silver contract intentionally keeps a compact analytical subset: composite risk/loss/vulnerability/resilience scores plus, for each FEMA hazard family, risk score, expected annual loss score, and annualized frequency.
  - The tract FEMA release is staged separately in `staging.fema_nri_tract` and is intentionally not promoted into this first-pass Silver contract.
sources:
  - staging.fema_nri
  - silver.xwalk_county_state
  - silver.xwalk_cbsa_county
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`county` or `cbsa`). }
  - { name: geo_id, type: VARCHAR, definition: Geographic identifier for the row. County rows use 5-digit county-equivalent FIPS and CBSA rows use 5-digit CBSA codes. }
  - { name: geo_name, type: VARCHAR, definition: Geographic display name for the row. County-equivalent names are normalized from the county-state crosswalk where available and CBSA names come from the CBSA crosswalk. }
  - { name: year, type: INTEGER, definition: FEMA National Risk Index release year. }
  - { name: risk_score, type: DOUBLE, definition: FEMA National Risk Index composite risk score. }
  - { name: eal_score, type: DOUBLE, definition: FEMA National Risk Index composite expected annual loss score. }
  - { name: alr_national_pctile, type: DOUBLE, definition: FEMA National Risk Index national percentile for annualized loss rate. }
  - { name: alr_vra_national_pctile, type: DOUBLE, definition: FEMA National Risk Index national percentile for annualized loss rate using the socially vulnerable population adjustment. }
  - { name: social_vulnerability_score, type: DOUBLE, definition: FEMA National Risk Index social vulnerability score. }
  - { name: community_resilience_score, type: DOUBLE, definition: FEMA National Risk Index community resilience score. }
