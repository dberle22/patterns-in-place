lineage:
  - step: read_source
    script: foundations/etl/staging/get_fema_nri.R
    details: Downloads the FEMA county-equivalent and tract NRI ZIP bundles, preserves the full source-faithful hazard matrices in staging, pads and validates the published FIPS helper fields, and materializes `staging.fema_nri` plus `staging.fema_nri_tract`.
  - step: standardize_geography
    script: foundations/etl/silver/fema_nri_silver.R
    details: Keeps the county-equivalent FEMA release at county grain, assigns canonical display names through the county-state crosswalk where possible, narrows the measure set to the approved compact analytical subset, and derives CBSA rows from county-equivalent staging with population-weighted averages.
  - step: write_target
    script: foundations/etl/silver/fema_nri_silver.R
    details: Writes `silver.fema_nri` with overwrite enabled.
