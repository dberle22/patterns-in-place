table_name: dim_geo
schema: gold
grain: One row per geo_level + geo_id.
primary_key:
  - geo_level
  - geo_id
foreign_keys: []
time_coverage:
  type: none
geo_coverage:
  notes:
    - Covers us, region, division, state, cbsa, county, and tract in the first release.
    - CBSA rows expose metro vs micro classification through cbsa_type, cbsa_type_short, is_metro, and is_micro.
    - County rows include optional parent_cbsa_code when the county belongs to a CBSA.
    - Tract rows use the exact tract-to-county hierarchy from silver.xwalk_tract_county.
columns:
  - name: geo_level
    type: VARCHAR
    definition: Canonical geography level for the entity row.
  - name: geo_id
    type: VARCHAR
    definition: Canonical identifier within geo_level.
  - name: geo_name
    type: VARCHAR
    definition: Canonical geography name.
  - name: display_name
    type: VARCHAR
    definition: User-facing label for charts, prompts, and QA surfaces.
  - name: hierarchy_rank
    type: INTEGER
    definition: Top-down hierarchy rank where smaller values are more aggregate.
  - name: state_fips
    type: VARCHAR
    definition: State FIPS attribute for rows that map cleanly to a single state.
  - name: state_name
    type: VARCHAR
    definition: State name attribute for rows that map cleanly to a single state.
  - name: state_abbr
    type: VARCHAR
    definition: State abbreviation attribute for rows that map cleanly to a single state.
  - name: region_id
    type: VARCHAR
    definition: Census region identifier where determinable.
  - name: region_name
    type: VARCHAR
    definition: Census region name where determinable.
  - name: division_id
    type: VARCHAR
    definition: Census division identifier where determinable.
  - name: division_name
    type: VARCHAR
    definition: Census division name where determinable.
  - name: cbsa_code
    type: VARCHAR
    definition: CBSA code attribute for cbsa rows and county rows that belong to a CBSA.
  - name: cbsa_name
    type: VARCHAR
    definition: CBSA name attribute for cbsa rows and county rows that belong to a CBSA.
  - name: cbsa_type
    type: VARCHAR
    definition: OMB CBSA type classification such as Metropolitan Statistical Area or Micropolitan Statistical Area.
  - name: cbsa_type_short
    type: VARCHAR
    definition: Normalized short label for CBSA type, currently metro or micro.
  - name: is_metro
    type: BOOLEAN
    definition: True when the row represents or belongs to a metropolitan CBSA.
  - name: is_micro
    type: BOOLEAN
    definition: True when the row represents or belongs to a micropolitan CBSA.
  - name: county_geoid
    type: VARCHAR
    definition: County GEOID attribute for county rows.
  - name: county_name
    type: VARCHAR
    definition: Short county name attribute for county rows.
  - name: county_name_long
    type: VARCHAR
    definition: Long county name attribute for county rows.
  - name: county_flag
    type: VARCHAR
    definition: Central or outlying county role within a CBSA where applicable.
  - name: primary_city_name
    type: VARCHAR
    definition: Principal city or cities associated with a CBSA row.
  - name: parent_geo_level
    type: VARCHAR
    definition: Immediate parent level used for the primary hierarchy path when a single parent exists.
  - name: parent_geo_id
    type: VARCHAR
    definition: Immediate parent identifier used for the primary hierarchy path when a single parent exists.
  - name: parent_us_id
    type: VARCHAR
    definition: Top-level United States parent identifier.
  - name: parent_region_id
    type: VARCHAR
    definition: Census region parent identifier where determinable.
  - name: parent_division_id
    type: VARCHAR
    definition: Census division parent identifier where determinable.
  - name: parent_state_fips
    type: VARCHAR
    definition: State parent identifier where determinable.
  - name: parent_cbsa_code
    type: VARCHAR
    definition: CBSA parent identifier for county rows that belong to a CBSA.
  - name: state_count
    type: INTEGER
    definition: Number of distinct states touched by the row when relevant, especially for multi-state CBSAs.
  - name: region_count
    type: INTEGER
    definition: Number of distinct Census regions touched by the row when relevant.
  - name: division_count
    type: INTEGER
    definition: Number of distinct Census divisions touched by the row when relevant.
  - name: county_count
    type: INTEGER
    definition: Number of counties represented by a CBSA row.
  - name: rucc_2023_code
    type: INTEGER
    definition: USDA ERS Rural-Urban Continuum Code for county rows on the current county-equivalent backbone.
  - name: rucc_2023_description
    type: VARCHAR
    definition: USDA ERS description associated with rucc_2023_code for county rows.
  - name: ers_industry_dependence_code
    type: INTEGER
    definition: USDA ERS normalized county industry-dependence code for county rows on the current county-equivalent backbone.
  - name: ers_industry_dependence_label
    type: VARCHAR
    definition: USDA ERS analytical county industry-dependence label derived from ers_industry_dependence_code.
  - name: ers_persistent_poverty_flag
    type: INTEGER
    definition: USDA ERS persistent-poverty county flag for county rows where the source publishes a standard binary value.
  - name: ers_retirement_destination_flag
    type: INTEGER
    definition: USDA ERS retirement-destination county flag for county rows.
  - name: ers_population_loss_flag
    type: INTEGER
    definition: USDA ERS population-loss county flag for county rows.
  - name: ers_housing_stress_flag
    type: INTEGER
    definition: USDA ERS housing-stress county flag for county rows.
  - name: ers_low_employment_flag
    type: INTEGER
    definition: USDA ERS low-employment county flag for county rows.
  - name: ers_low_postsecondary_ed_flag
    type: INTEGER
    definition: USDA ERS low-postsecondary-education county flag for county rows.
  - name: ers_high_farming_flag
    type: INTEGER
    definition: USDA ERS high-farming county flag for county rows.
  - name: ers_high_mining_flag
    type: INTEGER
    definition: USDA ERS high-mining county flag for county rows.
  - name: ers_high_manufacturing_flag
    type: INTEGER
    definition: USDA ERS high-manufacturing county flag for county rows.
  - name: ers_high_government_flag
    type: INTEGER
    definition: USDA ERS high-government county flag for county rows.
  - name: ers_high_recreation_flag
    type: INTEGER
    definition: USDA ERS high-recreation county flag for county rows.
  - name: ers_nonspecialized_flag
    type: INTEGER
    definition: USDA ERS nonspecialized county flag for county rows.
  - name: vintage
    type: INTEGER
    definition: Source vintage used to assemble the geography dimension.
  - name: source
    type: VARCHAR
    definition: Primary upstream source or derivation label.
lineage:
  upstream_tables:
    - silver.xwalk_state_region
    - silver.xwalk_county_state
    - silver.xwalk_cbsa_county
    - silver.xwalk_tract_county
    - silver.usda_county_typology
  build_asset: etl/gold/gold_dim_geo.sql
notes:
  - This is a serving-layer dimension table, not a time-series fact table.
  - Place and zcta are intentionally excluded from the first release until dedicated parent crosswalks are added.
  - primary_city_name is reserved in the schema for future enrichment but is null in the first release.
  - USDA ERS classification fields are populated only on county rows; CBSA rollups are intentionally deferred to a future explicit Gold transform.
backlog:
  - Add a canonical place-to-county and place-to-state crosswalk, then extend gold.dim_geo with place rows.
  - Add a canonical zcta hierarchy strategy, likely via weighted zcta-to-county and zcta-to-cbsa rollups, before extending gold.dim_geo with zcta rows.
