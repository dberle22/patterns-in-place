table_name: transport_built_form_sld
schema: gold
grain: One row per geo_level + geo_id + year (county-level EPA Smart Location Database baseline metrics).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2021'
  max: '2021'
geo_coverage:
  notes:
    - distinct_geo_levels=1
quality_notes:
  - This table is intentionally separate from `gold.transport_built_form_wide` because EPA SLD is a one-time 2021 baseline rather than a recurring annual series.
  - The current Gold contract is county-only.
  - Legacy Connecticut county GEOIDs are kept via a manual fallback so the 2021 SLD baseline aligns with the 2021 ACS county transport contract.
  - Alaska county-equivalent `02261` remains excluded because it no longer maps cleanly to the current county crosswalk.
sources:
  - silver.epa_sld
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`county`). }
  - { name: geo_id, type: VARCHAR, definition: Canonical 5-digit county GEOID. }
  - { name: geo_name, type: VARCHAR, definition: County display name. }
  - { name: year, type: INTEGER, definition: EPA Smart Location Database baseline year (`2021`). }
  - { name: state_abbr, type: VARCHAR, definition: State abbreviation. }
  - { name: total_population, type: DOUBLE, definition: Summed county population across constituent block groups. }
  - { name: total_employment, type: DOUBLE, definition: Summed county employment across constituent block groups. }
  - { name: housing_units, type: DOUBLE, definition: Summed county housing units across constituent block groups. }
  - { name: households, type: DOUBLE, definition: Summed county households across constituent block groups. }
  - { name: land_acres_unprotected, type: DOUBLE, definition: Summed county unprotected land acreage used as the density denominator. }
  - { name: block_group_count, type: INTEGER, definition: Number of staged block groups aggregated into the county row. }
  - { name: block_group_count_transit_non_null, type: INTEGER, definition: Number of constituent block groups with non-null transit service density values. }
  - { name: block_group_count_walkability_non_null, type: INTEGER, definition: Number of constituent block groups with non-null walkability values. }
  - { name: transit_population_coverage_share, type: DOUBLE, definition: Share of county population living in block groups with non-null transit metrics. }
  - { name: walkability_population_coverage_share, type: DOUBLE, definition: Share of county population living in block groups with non-null walkability metrics. }
  - { name: walkability_index, type: DOUBLE, definition: Population-weighted county walkability index. }
  - { name: employment_housing_mix, type: DOUBLE, definition: Household-weighted county employment and housing mix metric. }
  - { name: employment_mix, type: DOUBLE, definition: Employment-weighted county employment diversity metric. }
  - { name: street_intersection_density, type: DOUBLE, definition: Land-area-weighted county street intersection density metric. }
  - { name: auto_oriented_intersection_share, type: DOUBLE, definition: Land-area-weighted county auto-oriented network metric. }
  - { name: transit_service_density, type: DOUBLE, definition: Population-weighted county transit service density metric. }
  - { name: transit_frequency_peak, type: DOUBLE, definition: Population-weighted county peak transit frequency metric. }
  - { name: distance_to_transit, type: DOUBLE, definition: Population-weighted county distance-to-transit metric. }
  - { name: jobs_access_45min_transit, type: DOUBLE, definition: Population-weighted county jobs-accessible-by-transit metric. }
  - { name: workers_access_45min_transit, type: DOUBLE, definition: Population-weighted county workers-accessible-by-transit metric. }
  - { name: jobs_access_45min_auto, type: DOUBLE, definition: Population-weighted county jobs-accessible-by-auto metric. }
  - { name: workers_access_45min_auto, type: DOUBLE, definition: Population-weighted county workers-accessible-by-auto metric. }
  - { name: employment_density_gross, type: DOUBLE, definition: County employment density recomputed from summed employment and land area. }
  - { name: population_density_gross, type: DOUBLE, definition: County population density recomputed from summed population and land area. }
  - { name: housing_density_gross, type: DOUBLE, definition: County housing density recomputed from summed housing units and land area. }
