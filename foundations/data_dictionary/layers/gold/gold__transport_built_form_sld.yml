table_name: transport_built_form_sld
schema: gold
grain: One row per geo_level + geo_id + year (county, CBSA, and state EPA Smart Location Database baseline metrics).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2021'
  max: '2021'
geo_coverage:
  notes:
    - distinct_geo_levels=3
    - county_rows=3232
    - cbsa_rows=928
    - state_rows=56
quality_notes:
  - This table is intentionally separate from `gold.transport_built_form_wide` because EPA SLD is a one-time 2021 baseline rather than a recurring annual series.
  - The current Gold contract includes county, CBSA, and state rows promoted directly from `silver.epa_sld`.
  - Legacy Connecticut county GEOIDs are kept via a manual fallback so the 2021 SLD baseline aligns with the 2021 ACS county transport contract.
  - Alaska county-equivalent `02261` remains excluded because it no longer maps cleanly to the current county crosswalk.
  - Multi-state CBSAs intentionally keep `state_abbr` null rather than implying a single-state identity.
sources:
  - silver.epa_sld
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`county`, `cbsa`, or `state`). }
  - { name: geo_id, type: VARCHAR, definition: Canonical identifier within `geo_level` (county GEOID, CBSA code, or state FIPS). }
  - { name: geo_name, type: VARCHAR, definition: Geography display name. }
  - { name: year, type: INTEGER, definition: EPA Smart Location Database baseline year (`2021`). }
  - { name: state_abbr, type: VARCHAR, definition: State abbreviation where the row maps cleanly to a single state; multi-state CBSAs remain null. }
  - { name: total_population, type: DOUBLE, definition: Summed population across constituent block groups for the modeled geography. }
  - { name: total_employment, type: DOUBLE, definition: Summed employment across constituent block groups for the modeled geography. }
  - { name: housing_units, type: DOUBLE, definition: Summed housing units across constituent block groups for the modeled geography. }
  - { name: households, type: DOUBLE, definition: Summed households across constituent block groups for the modeled geography. }
  - { name: land_acres_unprotected, type: DOUBLE, definition: Summed unprotected land acreage used as the density denominator for the modeled geography. }
  - { name: block_group_count, type: INTEGER, definition: Number of staged block groups aggregated into the row. }
  - { name: block_group_count_transit_non_null, type: INTEGER, definition: Number of constituent block groups with non-null transit service density values. }
  - { name: block_group_count_walkability_non_null, type: INTEGER, definition: Number of constituent block groups with non-null walkability values. }
  - { name: transit_population_coverage_share, type: DOUBLE, definition: Share of geography population living in block groups with non-null transit metrics. }
  - { name: walkability_population_coverage_share, type: DOUBLE, definition: Share of geography population living in block groups with non-null walkability metrics. }
  - { name: walkability_index, type: DOUBLE, definition: Population-weighted walkability index. }
  - { name: employment_housing_mix, type: DOUBLE, definition: Household-weighted employment and housing mix metric. }
  - { name: employment_mix, type: DOUBLE, definition: Employment-weighted employment diversity metric. }
  - { name: street_intersection_density, type: DOUBLE, definition: Land-area-weighted street intersection density metric. }
  - { name: auto_oriented_intersection_share, type: DOUBLE, definition: Land-area-weighted auto-oriented network metric. }
  - { name: transit_service_density, type: DOUBLE, definition: Population-weighted transit service density metric. }
  - { name: transit_frequency_peak, type: DOUBLE, definition: Population-weighted peak transit frequency metric. }
  - { name: distance_to_transit, type: DOUBLE, definition: Population-weighted distance-to-transit metric. }
  - { name: jobs_access_45min_transit, type: DOUBLE, definition: Population-weighted jobs-accessible-by-transit metric. }
  - { name: workers_access_45min_transit, type: DOUBLE, definition: Population-weighted workers-accessible-by-transit metric. }
  - { name: jobs_access_45min_auto, type: DOUBLE, definition: Population-weighted jobs-accessible-by-auto metric. }
  - { name: workers_access_45min_auto, type: DOUBLE, definition: Population-weighted workers-accessible-by-auto metric. }
  - { name: employment_density_gross, type: DOUBLE, definition: Employment density recomputed from summed employment and land area. }
  - { name: population_density_gross, type: DOUBLE, definition: Population density recomputed from summed population and land area. }
  - { name: housing_density_gross, type: DOUBLE, definition: Housing density recomputed from summed housing units and land area. }
