table_name: environment_wide
schema: gold
grain: One row per geo_level + geo_id + year.
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2016'
  max: '2025'
geo_coverage:
  notes:
    - distinct_geo_levels=3
    - tract_rows are now included alongside county and cbsa rows
    - AQI remains county and cbsa only
    - EJScreen includes direct tract rows plus county and cbsa population-weighted rollups
    - FEMA includes tract, county, and cbsa rows where silver.fema_nri is available
quality_notes:
  - Live key check on 2026-06-08 found zero duplicates on geo_level + geo_id + year.
  - AQI remains the source-faithful county + CBSA slice of the table.
  - County rows inherit the Silver county-identification strategy: normalized EPA state and county names matched to canonical county GEOIDs, with a small documented manual alias fallback.
  - CBSA rows inherit the source-published 5-digit `cbsa_code` as `geo_id`.
  - Ten county rows were intentionally dropped upstream in Silver because they could not be matched to a canonical county GEOID after normalization.
  - EJScreen indicators are rolled up from tract to county and CBSA with population-weighted averages using tract population as the weight.
  - EJScreen tract rows are promoted directly from `silver.ejscreen`, while county and CBSA rows remain tract rollups.
  - EJScreen inherits the tract-Silver supported-geography boundary, so Puerto Rico and territorial archive rows are not represented in the current Gold rollup.
  - Because AQI has no tract contract, AQI fields remain null on tract rows.
  - FEMA NRI joins from `silver.fema_nri` at the shared `geo_level + geo_id + year` grain for tract, county, and cbsa rows.
  - Because FEMA is currently a single-release `2025` surface, FEMA fields are non-null only for `year = 2025`.
sources:
  - silver.epa_aqi
  - silver.ejscreen
  - silver.fema_nri
  - gold.dim_geo
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`tract`, `county`, or `cbsa`). }
  - { name: geo_id, type: VARCHAR, definition: Geographic identifier for the row. Tract rows use 11-digit tract GEOIDs, county rows use 5-digit county FIPS, and CBSA rows use 5-digit CBSA codes. }
  - { name: geo_name, type: VARCHAR, definition: Geographic display name for the row. }
  - { name: year, type: INTEGER, definition: Observation year. }
  - { name: days_with_aqi, type: INTEGER, definition: Number of days in the year with AQI observations for the geography. }
  - { name: good_days, type: INTEGER, definition: Number of days in the EPA Good AQI category. }
  - { name: moderate_days, type: INTEGER, definition: Number of days in the EPA Moderate AQI category. }
  - { name: usg_days, type: INTEGER, definition: Number of days in the EPA Unhealthy for Sensitive Groups AQI category. }
  - { name: unhealthy_days, type: INTEGER, definition: Number of days in the EPA Unhealthy AQI category. }
  - { name: very_unhealthy_days, type: INTEGER, definition: Number of days in the EPA Very Unhealthy AQI category. }
  - { name: hazardous_days, type: INTEGER, definition: Number of days in the EPA Hazardous AQI category. }
  - { name: max_aqi, type: INTEGER, definition: Maximum AQI observed in the geography during the year. }
  - { name: aqi_p90, type: DOUBLE, definition: Annual 90th percentile AQI for the geography. }
  - { name: aqi_median, type: DOUBLE, definition: Annual median AQI for the geography. }
  - { name: days_ozone, type: INTEGER, definition: Number of days where ozone was the driving pollutant for AQI. }
  - { name: days_pm25, type: INTEGER, definition: Number of days where PM2.5 was the driving pollutant for AQI. }
  - { name: ejs_population_covered, type: DOUBLE, definition: Total tract population represented in the EJScreen rollup for the geography and year. }
  - { name: ejs_pm25, type: DOUBLE, definition: Population-weighted tract-average EJScreen PM2.5 indicator for the geography. }
  - { name: ejs_ozone, type: DOUBLE, definition: Population-weighted tract-average EJScreen ozone indicator for the geography. }
  - { name: ejs_diesel_pm, type: DOUBLE, definition: Population-weighted tract-average EJScreen diesel particulate matter indicator for the geography. }
  - { name: ejs_traffic_proximity, type: DOUBLE, definition: Population-weighted tract-average EJScreen traffic proximity indicator for the geography. }
  - { name: ejs_superfund_proximity, type: DOUBLE, definition: Population-weighted tract-average EJScreen Superfund proximity indicator for the geography. }
  - { name: ejs_rmp_proximity, type: DOUBLE, definition: Population-weighted tract-average EJScreen Risk Management Plan proximity indicator for the geography. }
  - { name: ejs_wastewater_discharge, type: DOUBLE, definition: Population-weighted tract-average EJScreen wastewater discharge indicator for the geography. }
  - { name: ejs_drinking_water_noncompliance, type: DOUBLE, definition: Population-weighted tract-average EJScreen drinking water noncompliance indicator for the geography. }
  - { name: ejs_pctile_pm25_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen PM2.5 indicator. }
  - { name: ejs_pctile_ozone_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen ozone indicator. }
  - { name: ejs_pctile_diesel_pm_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen diesel particulate matter indicator. }
  - { name: ejs_pctile_traffic_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen traffic proximity indicator. }
  - { name: ejs_pctile_superfund_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen Superfund proximity indicator. }
  - { name: ejs_pctile_rmp_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen RMP proximity indicator. }
  - { name: ejs_pctile_wastewater_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen wastewater discharge indicator. }
  - { name: ejs_pctile_drinking_water_us, type: DOUBLE, definition: Population-weighted tract-average national percentile for the EJScreen drinking water noncompliance indicator. }
  - { name: ejs_avg_high_exposure_indicators, type: DOUBLE, definition: Population-weighted tract-average count of EJScreen indicators above the 80th percentile. }
  - { name: ejs_avg_high_exposure_supplemental, type: DOUBLE, definition: Population-weighted tract-average count of supplemental EJScreen indicators above the 80th percentile. }
  - { name: fema_risk_score, type: DOUBLE, definition: FEMA National Risk Index composite risk score for the geography. }
  - { name: fema_eal_score, type: DOUBLE, definition: FEMA National Risk Index composite expected annual loss score for the geography. }
  - { name: fema_alr_national_pctile, type: DOUBLE, definition: FEMA National Risk Index national percentile for annualized loss rate. }
  - { name: fema_alr_vra_national_pctile, type: DOUBLE, definition: FEMA National Risk Index national percentile for annualized loss rate using the socially vulnerable population adjustment. }
  - { name: fema_social_vulnerability_score, type: DOUBLE, definition: FEMA National Risk Index social vulnerability score for the geography. }
  - { name: fema_community_resilience_score, type: DOUBLE, definition: FEMA National Risk Index community resilience score for the geography. }
  - { name: fema_avalanche_risk_score, type: DOUBLE, definition: FEMA National Risk Index hazard risk score for avalanche. }
