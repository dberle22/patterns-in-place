table_name: food_access_wide
schema: gold
grain: One row per geo_level + geo_id + year (dedicated USDA Food Access Research Atlas baseline metrics).
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2019'
  max: '2019'
geo_coverage:
  notes:
    - distinct_geo_levels=3
quality_notes:
  - This table is intentionally separate from `gold.transport_built_form_wide` because the USDA Atlas is a one-time 2019 baseline rather than a recurring annual series.
  - Tract rows remain source-native to the Atlas and are not first-pass remapped to a newer tract backbone.
  - County rollups come directly from the tract GEOID prefix and CBSA rollups inherit county-to-CBSA coverage from `silver.xwalk_cbsa_county`.
  - The first-pass county rollup keeps the 8 legacy Connecticut county GEOIDs via an explicit manual name map and excludes Alaska county-equivalent `02261`.
sources:
  - silver.usda_food_atlas
columns:
  - { name: geo_level, type: VARCHAR, definition: Geographic level for the row (`tract`, `county`, or `cbsa`). }
  - { name: geo_id, type: VARCHAR, definition: Geographic identifier for the row. }
  - { name: geo_name, type: VARCHAR, definition: Geographic display name for the row. }
  - { name: year, type: INTEGER, definition: USDA Food Access Research Atlas baseline year (`2019`). }
  - { name: population_total, type: DOUBLE, definition: Total population represented by the geography. }
  - { name: population_low_access_1, type: DOUBLE, definition: Population count with low food access at the 1-mile threshold. }
  - { name: population_low_access_1_10, type: DOUBLE, definition: Population count with low food access under the main 1-mile urban / 10-mile rural Atlas threshold. }
  - { name: population_low_income_low_access_1, type: DOUBLE, definition: Low-income population count with low food access at the 1-mile threshold. }
  - { name: population_low_income_low_access_1_10, type: DOUBLE, definition: Low-income population count with low food access under the main Atlas threshold. }
  - { name: total_tract_count, type: INTEGER, definition: Number of tracts represented by the row. }
  - { name: lila_tract_count_1_10, type: INTEGER, definition: Number of tracts designated low income and low access under the main Atlas threshold. }
  - { name: low_income_tract_count, type: INTEGER, definition: Number of tracts designated low income. }
  - { name: low_access_tract_count_1_10, type: INTEGER, definition: Number of tracts designated low access under the main Atlas threshold. }
  - { name: pct_lila_tracts_1_and_10, type: DOUBLE, definition: Share of tracts designated low income and low access under the main Atlas threshold. }
  - { name: pct_low_income_tracts, type: DOUBLE, definition: Share of tracts designated low income. }
  - { name: pct_low_access_tracts_1_and_10, type: DOUBLE, definition: Share of tracts designated low access under the main Atlas threshold. }
  - { name: pct_population_low_access_1, type: DOUBLE, definition: Share of population with low food access at the 1-mile threshold. }
  - { name: pct_population_low_access_1_10, type: DOUBLE, definition: Share of population with low food access under the main Atlas threshold. }
  - { name: pct_population_low_income_low_access_1, type: DOUBLE, definition: Share of population that is both low income and low access at the 1-mile threshold. }
  - { name: pct_population_low_income_low_access_1_10, type: DOUBLE, definition: Share of population that is both low income and low access under the main Atlas threshold. }
  - { name: poverty_rate, type: DOUBLE, definition: Population-weighted poverty rate context field. }
  - { name: median_family_income, type: DOUBLE, definition: Population-weighted median family income context field. }
