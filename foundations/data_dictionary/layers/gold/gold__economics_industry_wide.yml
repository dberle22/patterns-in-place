table_name: economics_industry_wide
schema: gold
grain: One row per geo_level + geo_id + year.
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2012'
  max: '2024'
geo_coverage:
  notes:
    - base_spine=silver.age_kpi filtered to county,cbsa,state
    - geo_levels=cbsa,county,state
    - row_count=54631
    - qcew_populated_rows=54586
columns:
  - name: geo_level
    type: VARCHAR
    definition: Geography level for the row.
    needs_confirmation: no
  - name: geo_id
    type: VARCHAR
    definition: Geography identifier for the row.
    needs_confirmation: no
  - name: geo_name
    type: VARCHAR
    definition: Geography name for the row.
    needs_confirmation: no
  - name: year
    type: INTEGER
    definition: Calendar year for the geography-year observation.
    needs_confirmation: no
  - name: pop_total
    type: DOUBLE
    definition: Total population from the Gold base geography spine in `silver.age_kpi`.
    needs_confirmation: no
  - name: acs_ind_total_emp
    type: DOUBLE
    definition: ACS total employed population used as the denominator for ACS industry mix fields.
    needs_confirmation: no
  - name: real_gdp_total
    type: DOUBLE
    definition: Total real GDP from `silver.bea_regional_cagdp9_wide`.
    needs_confirmation: no
  - name: qcew_total_covered_emp
    type: DOUBLE
    definition: QCEW total covered annual average employment from the curated `industry_code = 10`, `own_code = 0` headline row.
    needs_confirmation: no
