    definition: QCEW location quotients comparing local private-sector employment shares to a state-aggregated national benchmark for the same year.
  - prefix: bea_earnings_
    definition: BEA CAINC5N earnings levels by broad family from `silver.bea_cainc5n`.
  - prefix: pct_bea_earnings_
    definition: BEA CAINC5N earnings shares relative to `bea_earnings_total`.
  - prefix: real_gdp_
    definition: BEA real GDP levels from `silver.bea_regional_cagdp9_wide`.
  - prefix: pct_real_gdp_
    definition: BEA real GDP shares from `silver.bea_regional_cagdp9_wide`.
