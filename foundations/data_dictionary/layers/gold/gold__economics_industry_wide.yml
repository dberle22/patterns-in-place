table_name: economics_industry_wide
schema: gold
grain: One row per geo_level + geo_id + year.
primary_key:
  - geo_level
  - geo_id
  - year
foreign_keys: []
time_coverage:
  type: range
  column: year
  min: '2012'
  max: '2024'
geo_coverage:
  notes:
    - base_spine=silver.age_kpi filtered to county,cbsa,state
    - geo_levels=cbsa,county,state
    - row_count=54631
    - cbp_populated_rows=49327
    - bfs_populated_rows=53472
    - bfs_rate_populated_rows=49327
    - qcew_populated_rows=54586
