  - frame_id: livability
    display_name: Livability
    description: Whether day-to-day living conditions — affordability, health, access, and physical environment — support quality of life for residents.
    phase: 3
    execution_order: 1
    status: calibrated
    natural_k: 6
    calibration_notes: First calibrated notebook pass on the current 396-CBSA universe excluding Puerto Rico. Median imputation applied to 6 KPIs. A PCA and correlation audit was run for redundancy review, but the chosen published clustering pass retains all 26 KPIs. We keep k at 6 because it adds a meaningful extra split beyond k = 5 while still avoiding the over-fragmentation that begins at higher k values.
    output_parquet: exploration/intelligence_framework/phase_3_livability_calibration/outputs/livability_scores.parquet
    datamart_table: mart_intelligence.intelligence_livability
    valid_geo_levels: [cbsa]

    clustering:
      method: hierarchical → kmeans → gmm
      natural_k: 6
      label_set: provisional centroid-derived labels from subject strengths and drags

    scoring:
      composite_output: livability_percentile_rank
      smell_test: NYC / coastal metros near bottom on Affordability; Midwest interior near top

    similarity:
      method: cosine
      output: top_10_livability_peers per CBSA

