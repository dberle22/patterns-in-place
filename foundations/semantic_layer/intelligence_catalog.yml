version: 2
catalog_name: intelligence_catalog
description: >
  Intelligence frame definitions for the Character, Livability, and Opportunity scoring models.
  Each frame produces three outputs from the same standardized KPI vectors: cluster labels
  (K-Means hard assignments), soft membership probabilities (GMM), and a composite percentile
  score built from hierarchical weighted sub-scores. Cosine similarity on the scored vectors
  produces frame-specific peer sets.

  Architecture is locked. See INTELLIGENCE_LAYER_ROADMAP.md → "Scoring and Clustering Architecture"
  for full methodology decisions. Status moves from "specified" → "calibrated" after each phase
  notebook runs and the natural_k and calibration_notes fields are populated.

  Catalog updates happen per phase — not deferred to Phase 8. Phase 8 verifies and promotes.

architecture:
  universe: 401 CBSAs with pop_total >= 100000
  missing_data: median imputation per KPI; KNN considered only when missingness > 15% and non-random
  standardization: z-score on all KPIs before clustering or scoring
  polarity: positive = higher is better; negative = lower is better; negative KPIs sign-flipped before scoring only
  clustering_sequence:
    - step: hierarchical_agglomerative
      purpose: discover natural k from dendrogram
    - step: kmeans
      purpose: hard cluster labels for publication
    - step: gmm
      purpose: soft membership probabilities; honest about hybrid metros
  scoring_hierarchy: KPI z-score → topic mean → subject weighted mean → frame composite → percentile rank (0-100)
  subject_weights: equal across subjects within each frame for initial model
  topic_weights: coverage_share * reliability_factor; normalized within subject
  reliability_factors:
    core: 1.00
    supplemental_baseline: 0.75
    coverage_caution: 0.60
  kpi_weights: equal split across selected core KPIs within topic
  similarity: cosine distance on standardized KPI vectors
  benchmarks: [national, census_division, cluster_peers]
  output_format: parquet in exploration/intelligence_framework/outputs/
  datamart_promotion: Phase 8 via foundations/loaders/ R scripts into mart_intelligence.intelligence_*

frames:

  # ---------------------------------------------------------------------------
  # LIVABILITY — Phase 3 (first in execution order)
