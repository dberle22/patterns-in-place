  # ---------------------------------------------------------------------------
  # CROSS-FRAME — Phase 5
  # ---------------------------------------------------------------------------

  - frame_id: cross_frame
    display_name: Cross-Frame Combined Model
    description: Combined clustering and similarity model built from the concatenated KPI vectors of all three frames. Answers which metros are alike overall and which are diverging across frames.
    phase: 5
    execution_order: 4
    status: calibrated
    natural_k: 6
    calibration_notes: The combined model now runs from the completed Phase 5 integration build and keeps the published reduced 35-KPI bundle with k = 6. The production parquet is the Phase 5 integration output, and the downstream `mart_intelligence` table carries the combined cluster, soft memberships, frame-level percentile carrythrough, and similarity context for the 396-CBSA published universe.
    output_parquet: exploration/intelligence_framework/phase_5_cross_frame_integration/outputs/cross_frame_scores.parquet
    datamart_table: mart_intelligence.intelligence_cross_frame
    valid_geo_levels: [cbsa]

    depends_on: [livability, opportunity, character]

    clustering:
      method: hierarchical → kmeans → gmm
      input: concatenated standardized KPI vectors from all three frames
      natural_k: 6
      label_set: published centroid-derived labels from Phase 5 integration

    similarity:
      method: cosine
      input: concatenated standardized KPI vectors from all three frames
      output: top_10_overall_peers per CBSA

    overlap_check:
      description: Compare frame-specific cluster assignments to identify metros diverging across frames
      output: cross_frame_divergence_flag per CBSA
      use: primary Deep Dive candidate feed; highest-priority candidates are metros that diverge meaningfully across frames
