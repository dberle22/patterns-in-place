version: 2
catalog_name: theme_catalog
description: >
  User-facing topic organization for the Chatbot and Area Explorer. Groups metrics into
  browsable topics within each theme (Character / Livability / Opportunity). Topic structure
  reflects the calibrated Phase 2–4 intelligence frame models. Cross-Frame combined outputs
  live primarily in the DataMart and question layer rather than as a fourth navigation theme.
  Metrics with standalone query value are retained even if dropped from the default clustering set.
themes:

  # ---------------------------------------------------------------------------
  # CHARACTER
  # ---------------------------------------------------------------------------

  - theme_id: character
    display_name: Character
    description: Who lives in a place — demographic composition, social fabric, civic identity, and built form — and what makes it structurally distinct from other metros.

    intelligence_outputs:
      - character_percentile_rank
      - character_cluster

    topics:

      - topic_id: race_and_ethnicity
        display_name: Race and Ethnicity
        intelligence_frame_topic: true
        metrics:
          - diversity_index
          - pct_white_nh
          - pct_black_nh
          - pct_asian_nh
          - pct_hispanic
          - pct_aian_nh
          - pct_nhpi_nh

      - topic_id: age_structure
        display_name: Age Structure
        intelligence_frame_topic: true
        metrics:
          - pct_age_over_64
          - pct_age_under_18
          - pct_age_18_64
          - median_age
          - dependents_per_worker
          - aging_index

      - topic_id: educational_attainment
        display_name: Educational Attainment
        intelligence_frame_topic: true
        metrics:
          - pct_ba_plus
          - pct_grad_plus

      - topic_id: nativity_and_citizenship
        display_name: Nativity and Citizenship
        intelligence_frame_topic: true
        metrics:
          - pct_foreign_born
          - pct_non_citizen

      - topic_id: population_density
        display_name: Population Density
        intelligence_frame_topic: true
        metrics:
          - pop_weighted_density_sqmi
          - gross_density_sqmi

      - topic_id: social_capital
        display_name: Social Capital
        intelligence_frame_topic: true
        metrics:
          - friending_bias
          - civic_engagement_volunteering_rate
          - civic_organizations_per_1000
          - childhood_friending_bias
          - economic_connectedness
          - cohesion_clustering
          - cohesion_support_ratio

      - topic_id: nonprofits_and_civic_orgs
        display_name: Nonprofits and Civic Organizations
        intelligence_frame_topic: true
        metrics:
          - nonprofits_per_100k
          - nonprofits_total_per_100k

      - topic_id: residential_stability
        display_name: Residential Stability and Migration
        intelligence_frame_topic: true
        metrics:
          - irs_net_migration_rate
          - pct_moved_diff_st
          - pct_moved_abroad
          - pct_moved_same_cnty
          - mobility_rate
          - pct_same_house
          - irs_net_migration

      - topic_id: social_associations
        display_name: Social Associations
        intelligence_frame_topic: true
        metrics:
          - social_associations_per_10k

      - topic_id: built_form
        display_name: Built Form
        intelligence_frame_topic: true
        metrics:
          - pct_struct_multifam
          - owner_occ_rate
          - renter_occ_rate

      - topic_id: population_size_and_growth
        display_name: Population Size and Growth
        intelligence_frame_topic: false
        metrics:
          - pop_total
          - pop_growth_1yr
          - pop_growth_5yr
          - pop_growth_10yr

  # ---------------------------------------------------------------------------
  # LIVABILITY
  # ---------------------------------------------------------------------------

  - theme_id: livability
    display_name: Livability
    description: Whether day-to-day living conditions — affordability, health, access, and physical environment — support quality of life for residents.

    intelligence_outputs:
      - livability_percentile_rank
      - livability_cluster
      - affordability_score
      - health_and_safety_score
      - access_and_infrastructure_score
      - physical_environment_score

    topics:

      - topic_id: price_pressure
        display_name: Price Pressure
        intelligence_frame_topic: true
        metrics:
          - value_to_income
          - rent_to_income
          - rpp_real_pc_income
          - median_home_value
          - median_gross_rent
          - annualized_median_rent

      - topic_id: housing_burden
        display_name: Housing Burden
        intelligence_frame_topic: true
        metrics:
          - pct_rent_burden_30plus
          - pct_rent_burden_50plus
          - pct_cost_burdened
          - pct_severely_cost_burdened
          - pct_renter_severely_cost_burdened

      - topic_id: poverty_context
        display_name: Poverty Context
        intelligence_frame_topic: true
        metrics:
          - pov_rate
          - gini_index

      - topic_id: housing_supply
        display_name: Housing Supply
        intelligence_frame_topic: true
        metrics:
          - permits_per_1000_housing_units
          - permits_share_units_5_plus
          - permits_avg_units_per_bldg
          - permits_share_multifam_units
          - vacancy_rate
          - hu_total
          - fmr_gap_2br_vs_median_rent
          - rent50_gap_2br_vs_median_rent

      - topic_id: housing_structure_mix
        display_name: Housing Structure Mix
        intelligence_frame_topic: true
        metrics:
          - pct_struct_mobile
          - pct_struct_small_mf
          - pct_struct_mid_mf
          - pct_struct_large_mf
          - pct_struct_multifam

      - topic_id: health_outcomes
        display_name: Health Outcomes
        intelligence_frame_topic: true
        metrics:
          - premature_death_rate
          - child_mortality_rate
          - life_expectancy
          - infant_mortality_rate

      - topic_id: health_behavior_and_access
        display_name: Health Behavior and Access
        intelligence_frame_topic: true
        metrics:
          - mental_health_provider_ratio
          - drug_overdose_death_rate
          - pct_uninsured_adults
          - preventable_hospital_stay_rate
          - primary_care_ratio
          - child_care_cost_burden_rate
          - physical_inactivity
          - adult_obesity
          - poor_mental_health_days
          - food_insecurity_rate

      - topic_id: violence_and_injury
        display_name: Violence and Injury
        intelligence_frame_topic: true
        metrics:
          - firearm_fatality_rate
          - motor_vehicle_crash_rate
          - homicide_rate

      - topic_id: commute_and_mode
        display_name: Commute and Mode Access
        intelligence_frame_topic: true
        metrics:
          - pct_commute_walk
          - pct_commute_wfh
          - pct_commute_transit
          - pct_commute_drive_alone
          - pct_low_car_commute
          - mean_travel_time

      - topic_id: vehicle_access
        display_name: Vehicle Access
        intelligence_frame_topic: true
        metrics:
          - pct_hh_0_vehicles

      - topic_id: digital_access
        display_name: Digital Access
        intelligence_frame_topic: true
        metrics:
          - pct_no_internet_access
          - pct_broadband_subscription

      - topic_id: walkability_baseline
        display_name: Walkability and Transit Baseline
        intelligence_frame_topic: true
        metrics:
          - walkability_index
          - jobs_access_45min_transit
          - transit_service_density
          - jobs_access_45min_auto

      - topic_id: food_access_baseline
        display_name: Food Access Baseline
        intelligence_frame_topic: true
        metrics:
          - pct_population_low_income_low_access_1_10
          - pct_population_low_access_1_10

      - topic_id: air_pollution
        display_name: Air Pollution
        intelligence_frame_topic: true
        metrics:
          - aqi_unhealthy_days
          - aqi_median
          - aqi_p90
          - ej_pm25
          - ej_diesel_pm
