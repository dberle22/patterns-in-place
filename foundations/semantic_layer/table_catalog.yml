  # ---------------------------------------------------------------------------
  # Intelligence frame score tables (Gold — promoted from Phase 2–4 parquets via Phase 8 loaders)
  # These tables are read-only lookups: one row per CBSA, no year dimension.
  # ---------------------------------------------------------------------------

  - table_id: intelligence_livability
    schema: gold
    table_name: intelligence_livability
    subject_areas: [livability, intelligence]
    description: >
      Precomputed Livability frame scores for all 401 CBSAs. Contains the cluster label,
      GMM soft membership probabilities, topic and subject z-scores, composite percentile rank,
      and top-10 cosine-similarity peers. One static row per CBSA — no time dimension.
    grain: one row per cbsa_code
    primary_key: [cbsa_code]
    geo_id_field: cbsa_code
    geo_level_field: null
    geo_name_field: cbsa_name
    time_field: null
    supported_geo_levels: [cbsa]
    sources:
      - source_id: INTELLIGENCE_PHASE3
        columns:
          - livability_cluster
          - livability_percentile_rank
          - affordability_score
          - health_and_safety_score
          - access_and_infrastructure_score
          - physical_environment_score
    upstream_dependencies:
      - exploration/intelligence_framework/phase_3_livability_calibration/outputs/livability_scores.parquet
    columns:
      - column_name: livability_cluster
        type: string
        description: Hard cluster label assigned by K-Means (k=6).
        source_id: INTELLIGENCE_PHASE3
        queryable: true
      - column_name: livability_percentile_rank
        type: integer
        description: Composite Livability percentile rank (0-100) within the 401-CBSA universe.
        source_id: INTELLIGENCE_PHASE3
        queryable: true
      - column_name: affordability_score
        type: number_2dp
        description: Affordability subject z-score (sign-flipped for scoring direction).
        source_id: INTELLIGENCE_PHASE3
        queryable: true
      - column_name: health_and_safety_score
        type: number_2dp
        description: Health and Safety subject z-score.
        source_id: INTELLIGENCE_PHASE3
        queryable: true
      - column_name: access_and_infrastructure_score
        type: number_2dp
        description: Access and Infrastructure subject z-score.
        source_id: INTELLIGENCE_PHASE3
        queryable: true
      - column_name: physical_environment_score
        type: number_2dp
        description: Physical Environment subject z-score.
        source_id: INTELLIGENCE_PHASE3
        queryable: true
    notes:
      - No year filter — this is a static calibration snapshot, not a time series.
      - Promoted to Gold via foundations/loaders/load_livability_scores.R in Phase 8.
      - Peer columns (top10_peer_1_cbsa_code … top10_peer_10_cbsa_code) also present but not listed here individually.
    status: active

