  - table_id: intelligence_zones_zcta
    schema: mart_intelligence
    table_name: intelligence_zones_zcta
    subject_areas: [character, livability, opportunity, intelligence, zones]
    description: >
      ZCTA-level rollup of the Phase 7 tract zone assignments. Uses the HUD
      tract-to-ZCTA crosswalk and population weights to assign a dominant zone
      type when one cluster exceeds 50 percent of the weighted tract mix; keeps
      a Mixed Zone label otherwise and preserves the full weighted composition.
    grain: one row per zip_geoid
    primary_key: [zip_geoid]
    geo_id_field: zip_geoid
    geo_level_field: null
    geo_name_field: zcta_city
    time_field: null
    supported_geo_levels: [zcta]
    sources:
      - source_id: INTELLIGENCE_PHASE7
        columns:
          - primary_zone_type
          - dominant_zone_type
          - dominant_zone_share
          - secondary_zone_type
          - secondary_zone_share
    upstream_dependencies:
      - exploration/intelligence_framework/phase_7_zone_methodology/outputs/zone_scores_zcta.parquet
      - silver.xwalk_zcta_tract
    columns:
      - column_name: primary_zone_type
        type: string
        description: Published ZCTA zone label; equals the dominant tract zone only when its weighted share exceeds 50 percent, otherwise Mixed Zone.
        source_id: INTELLIGENCE_PHASE7
        queryable: true
      - column_name: is_mixed_zone
        type: boolean
        description: Flag for ZCTAs where no single tract zone exceeds 50 percent of the weighted population mix.
        source_id: INTELLIGENCE_PHASE7
        queryable: true
      - column_name: dominant_zone_type
        type: string
        description: The largest tract zone component in the ZCTA's weighted composition, even when the published label is Mixed Zone.
        source_id: INTELLIGENCE_PHASE7
        queryable: true
      - column_name: dominant_zone_share
        type: percent
        description: Population-weighted share of the dominant tract zone within the ZCTA.
        source_id: INTELLIGENCE_PHASE7
        queryable: true
      - column_name: secondary_zone_type
        type: string
        description: The second-largest tract zone component in the ZCTA's weighted composition.
        source_id: INTELLIGENCE_PHASE7
        queryable: true
      - column_name: secondary_zone_share
        type: percent
        description: Population-weighted share of the second-largest tract zone within the ZCTA.
        source_id: INTELLIGENCE_PHASE7
        queryable: true
    notes:
      - Promoted to the `mart_intelligence` schema via foundations/loaders/load_zone_scores_zcta.R.
      - Built only for ZCTAs that intersect the modeled tract universe with positive population crosswalk weight.
      - The wide `share_*` columns intentionally preserve the full weighted composition so the assignment threshold can change without recomputing the rollup.
    status: active

