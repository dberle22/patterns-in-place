version: 2
catalog_name: metric_catalog
description: Curated queryable metrics exposed by the canonical patterns-foundations semantic layer.
metrics:
  - metric_id: pop_total
    display_name: Total Population
    description: Total resident population for the geography and year.
    source_table: population_demographics
    source_column: pop_total
    formula: null
    unit_format: integer
    subject_areas: [population]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: true
    growth_windows: [1, 5, 10]
    caveats: Use growth variants for change analysis instead of recomputing from sparse early-year rows.
    status: active

  - metric_id: pop_growth_1yr
    display_name: Population Growth (1 Year)
    description: One-year percentage change in total population.
    source_table: population_demographics
    source_column: pop_growth_1yr
    formula: null
    unit_format: percent
    subject_areas: [population]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Null in the first observed year for each geography.
    status: active

  - metric_id: pop_growth_5yr
    display_name: Population Growth (5 Year)
    description: Five-year percentage change in total population.
    source_table: population_demographics
    source_column: pop_growth_5yr
    formula: null
    unit_format: percent
    subject_areas: [population]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Strong default for growth rankings and momentum questions.
    status: active

  - metric_id: pop_growth_10yr
    display_name: Population Growth (10 Year)
    description: Ten-year percentage change in total population.
    source_table: population_demographics
    source_column: pop_growth_10yr
    formula: null
    unit_format: percent
    subject_areas: [population]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Prefer for long-cycle market context rather than short-run trend analysis.
    status: active

  - metric_id: median_age
    display_name: Median Age
    description: Median age of the resident population.
    source_table: population_demographics
    source_column: median_age
    formula: null
    unit_format: number_1dp
    subject_areas: [population]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Smaller geographies can be noisy.
    status: active

  - metric_id: pct_age_under_18
    display_name: Share Under 18
    description: Share of residents younger than 18.
    source_table: population_demographics
    source_column: pct_age_under_18
    formula: null
    unit_format: percent
    subject_areas: [population]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Interpret alongside total population size for small geographies.
    status: active

  - metric_id: pct_age_18_64
    display_name: Share Age 18 to 64
    description: Share of residents age 18 to 64.
    source_table: population_demographics
    source_column: pct_age_18_64
    formula: null
    unit_format: percent
    subject_areas: [population]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Useful as working-age context, not a labor-market measure by itself.
    status: active

  - metric_id: pct_age_over_64
    display_name: Share Age 65+
    description: Share of residents age 65 and older.
    source_table: population_demographics
    source_column: pct_age_over_64
    formula: null
    unit_format: percent
    subject_areas: [population]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Best paired with median age and dependency metrics.
    status: active

  - metric_id: dependents_per_worker
    display_name: Dependents Per Worker
    description: Ratio of young and older dependents to core working-age residents.
    source_table: population_demographics
    source_column: dependents_per_worker
    formula: null
    unit_format: ratio
    subject_areas: [population]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Ratios can become unstable where the working-age denominator is very small.
    status: active

  - metric_id: aging_index
    display_name: Aging Index
    description: Ratio of older residents to younger residents.
    source_table: population_demographics
    source_column: aging_index
    formula: null
    unit_format: index
    subject_areas: [population]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Useful directional signal, but not as intuitive as age shares for end users.
    status: active

  - metric_id: pct_white_nh
    display_name: Non-Hispanic White Share
    description: Share of residents who identify as non-Hispanic White.
    source_table: population_demographics
    source_column: pct_white_nh
    formula: null
    unit_format: percent
    subject_areas: [race_ethnicity]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Use together with other race and ethnicity shares to avoid overinterpreting a single share.
    status: active

  - metric_id: pct_black_nh
    display_name: Non-Hispanic Black Share
    description: Share of residents who identify as non-Hispanic Black.
    source_table: population_demographics
    source_column: pct_black_nh
    formula: null
    unit_format: percent
    subject_areas: [race_ethnicity]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Use with diversity and other composition measures.
    status: active

  - metric_id: pct_asian_nh
    display_name: Non-Hispanic Asian Share
    description: Share of residents who identify as non-Hispanic Asian.
    source_table: population_demographics
    source_column: pct_asian_nh
    formula: null
    unit_format: percent
    subject_areas: [race_ethnicity]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Use with diversity and other composition measures.
    status: active

  - metric_id: pct_hispanic
    display_name: Hispanic Share
    description: Share of residents who identify as Hispanic or Latino.
    source_table: population_demographics
    source_column: pct_hispanic
    formula: null
    unit_format: percent
    subject_areas: [race_ethnicity]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Ethnicity share can overlap analytically with race categories when discussing composition.
    status: active

  - metric_id: diversity_index
    display_name: Diversity Index
    description: Diversity index derived from race and ethnicity shares.
    source_table: population_demographics
    source_column: diversity_index
    formula: 1 - sum(share_i^2)
    unit_format: index
    subject_areas: [race_ethnicity]
    themes: [character]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Not directly interpretable as a percentage.
    status: active

  - metric_id: pct_ba_plus
    display_name: Share With Bachelor's Degree Or Higher
    description: Share of adults age 25+ with a bachelor's degree or higher.
    source_table: population_demographics
    source_column: pct_ba_plus
    formula: null
    unit_format: percent
    subject_areas: [education]
    themes: [character, livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Education shares can be volatile in very small areas.
    status: active

  - metric_id: pct_grad_plus
    display_name: Share With Graduate Degree
    description: Share of adults age 25+ with a graduate or professional degree.
    source_table: population_demographics
    source_column: pct_grad_plus
    formula: null
    unit_format: percent
    subject_areas: [education]
    themes: [character, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Best used as a high-skill attainment signal rather than a general education proxy.
    status: active

  - metric_id: hu_total
    display_name: Total Housing Units
    description: Total housing units.
    source_table: housing_core_wide
    source_column: hu_total
    formula: null
    unit_format: integer
    subject_areas: [housing]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: true
    growth_windows: [1, 3, 5]
    caveats: Use query-time growth calculations for windows not stored directly.
    status: active

  - metric_id: vacancy_rate
    display_name: Vacancy Rate
    description: Share of housing units that are vacant.
    source_table: housing_core_wide
    source_column: vacancy_rate
    formula: null
    unit_format: percent
    subject_areas: [housing]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Best interpreted alongside stock size and tenure context.
    status: active

  - metric_id: owner_occ_rate
    display_name: Owner Occupancy Rate
    description: Share of occupied housing units that are owner occupied.
    source_table: housing_core_wide
    source_column: owner_occ_rate
    formula: null
    unit_format: percent
    subject_areas: [housing]
    themes: [character, livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Complementary to renter occupancy rate.
    status: active

  - metric_id: renter_occ_rate
    display_name: Renter Occupancy Rate
    description: Share of occupied housing units that are renter occupied.
    source_table: housing_core_wide
    source_column: renter_occ_rate
    formula: null
    unit_format: percent
    subject_areas: [housing]
    themes: [character, livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Complementary to owner occupancy rate.
    status: active

  - metric_id: median_gross_rent
    display_name: Median Gross Rent
    description: Median monthly gross rent.
    source_table: housing_core_wide
    source_column: median_gross_rent
    formula: null
    unit_format: currency
    subject_areas: [housing]
    themes: [livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: true
    growth_windows: [1, 3, 5]
    caveats: Nominal values are not inflation adjusted.
    status: active

  - metric_id: annualized_median_rent
    display_name: Annualized Median Rent
    description: Median monthly gross rent multiplied by 12.
    source_table: housing_core_wide
    source_column: annualized_median_rent
    formula: median_gross_rent * 12
    unit_format: currency
    subject_areas: [housing]
    themes: [livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Useful for affordability ratio calculations.
    status: active

  - metric_id: median_home_value
    display_name: Median Home Value
    description: Median owner-occupied home value.
    source_table: housing_core_wide
    source_column: median_home_value
    formula: null
    unit_format: currency
    subject_areas: [housing]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: true
    growth_windows: [1, 3, 5]
    caveats: Not a repeat-sales price index; interpret differently from FHFA-style appreciation.
    status: active

  - metric_id: pct_rent_burden_30plus
    display_name: Share Cost Burdened Renters
    description: Share of renter households spending at least 30 percent of income on rent.
    source_table: housing_core_wide
    source_column: pct_rent_burden_30plus
    formula: null
    unit_format: percent
    subject_areas: [affordability]
    themes: [livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Should be interpreted with vacancy and income context.
    status: active

  - metric_id: pct_rent_burden_50plus
    display_name: Share Severely Cost Burdened Renters
    description: Share of renter households spending at least 50 percent of income on rent.
    source_table: housing_core_wide
    source_column: pct_rent_burden_50plus
    formula: null
    unit_format: percent
    subject_areas: [affordability]
    themes: [livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Represents the severe end of renter burden.
    status: active

  - metric_id: rent_to_income
    display_name: Rent To Income Ratio
    description: Annualized median rent divided by ACS income context.
    source_table: housing_core_wide
    source_column: rent_to_income
    formula: annualized_median_rent / per_capita_income_proxy
    unit_format: ratio
    subject_areas: [affordability]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Nominal ratio; use the RPP-adjusted variant for cost-of-living-normalized comparisons.
    status: active

  - metric_id: value_to_income
    display_name: Home Value To Income Ratio
    description: Median home value divided by household income context.
    source_table: housing_core_wide
    source_column: value_to_income
    formula: median_home_value / income_proxy
    unit_format: ratio
    subject_areas: [affordability]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Sensitive to local ownership mix and ACS income noise.
    status: active

  - metric_id: fmr_2br
    display_name: FMR 2BR
    description: HUD fair market rent for a two-bedroom unit.
    source_table: housing_core_wide
    source_column: fmr_2br
    formula: null
    unit_format: currency
    subject_areas: [housing_benchmark]
    themes: [livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
