    status: active

  - metric_id: rent50_2br
    display_name: Rent50 2BR
    description: HUD 50th percentile rent for a two-bedroom unit.
    source_table: housing_core_wide
    source_column: rent50_2br
    formula: null
    unit_format: currency
    subject_areas: [housing_benchmark]
    themes: [livability]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Treat as benchmark context rather than a market-clearing estimate.
    status: active

  - metric_id: fmr_gap_2br_vs_median_rent
    display_name: FMR Gap Vs Median Rent
    description: Difference between HUD two-bedroom fair market rent and median gross rent.
    source_table: housing_core_wide
    source_column: fmr_gap_2br_vs_median_rent
    formula: fmr_2br - median_gross_rent
    unit_format: currency
    subject_areas: [housing_benchmark]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Can be misleading where HUD benchmark coverage is sparse.
    status: active

  - metric_id: rent50_gap_2br_vs_median_rent
    display_name: Rent50 Gap Vs Median Rent
    description: Difference between HUD rent50 two-bedroom rent and median gross rent.
    source_table: housing_core_wide
    source_column: rent50_gap_2br_vs_median_rent
    formula: rent50_2br - median_gross_rent
    unit_format: currency
    subject_areas: [housing_benchmark]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
    caveats: Use alongside the raw benchmark measures.
    status: active

