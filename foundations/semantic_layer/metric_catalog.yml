    source_column: permits_share_multifam_units
    formula: null
    unit_format: percent
    subject_areas: [housing_supply]
    themes: [livability, opportunity]
    valid_geo_levels: [us, region, division, state, cbsa, county, place, zcta, tract]
    growth_eligible: false
    growth_windows: []
