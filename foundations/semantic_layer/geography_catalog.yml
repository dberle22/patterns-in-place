version: 3
catalog_name: geography_catalog
description: Canonical geography levels, hierarchy edges, and restricted rollup paths for the patterns-foundations semantic layer.
geo_levels:
  - geo_level: us
    display_name: United States
    plural_display_name: United States
    id_shape: single literal row
    hierarchy_rank: 1
    supported_in_mvp: true
    stability_class: stable
    boundary_authority: Census geographic reference
    available_vintages: [2020]
    default_vintage: 2020
    geometry_roles: [derived_analysis, derived_display]
    notes:
      - Warehouse rows may appear as `US`; the semantic layer normalizes to `us`.

  - geo_level: region
    display_name: Census Region
    plural_display_name: Census Regions
    id_shape: small integer-like code
    hierarchy_rank: 2
    supported_in_mvp: true
    stability_class: stable
    boundary_authority: Census geographic reference
    available_vintages: [2020]
    default_vintage: 2020
    geometry_roles: [derived_analysis, derived_display]
    notes:
      - Warehouse rows may appear as `Region`; the semantic layer normalizes to `region`.

  - geo_level: division
    display_name: Census Division
    plural_display_name: Census Divisions
    id_shape: small integer-like code
    hierarchy_rank: 3
    supported_in_mvp: true
    stability_class: stable
    boundary_authority: Census geographic reference
    available_vintages: [2020]
    default_vintage: 2020
    geometry_roles: [derived_analysis, derived_display]
    notes:
      - Derived from Census division mappings in `silver.xwalk_state_region`.

  - geo_level: state
    display_name: State
    plural_display_name: States
    id_shape: 2-digit FIPS
    hierarchy_rank: 4
    supported_in_mvp: true
    stability_class: stable
    boundary_authority: Census TIGER/Line
    available_vintages: [2020, 2023, 2024]
    default_vintage: 2024
    geometry_roles: [analysis, display]
    notes:
      - Includes DC in the current crosswalk coverage.

  - geo_level: cbsa
    display_name: CBSA
    plural_display_name: CBSAs
    id_shape: 5-digit CBSA code
    hierarchy_rank: 5
    supported_in_mvp: true
    stability_class: periodic
    boundary_authority: OMB CBSA delineation bulletin
    available_vintages: [2023]
    default_vintage: 2023
    geometry_roles: [analysis, display]
    notes:
      - CBSA membership uses OMB county assignments.

  - geo_level: county
    display_name: County
    plural_display_name: Counties
    id_shape: 5-digit county GEOID
    hierarchy_rank: 6
    supported_in_mvp: true
    stability_class: continuous
    boundary_authority: Census TIGER/Line
    available_vintages: [2020, 2023, 2024]
    default_vintage: 2023
    geometry_roles: [analysis, display]
    notes:
      - County-to-state mapping is exact and one-to-one.

  - geo_level: place
    display_name: Place
    plural_display_name: Places
    id_shape: Census place GEOID
    hierarchy_rank: 7
    supported_in_mvp: true
    stability_class: continuous
    boundary_authority: Census Boundary and Annexation Survey / TIGER/Line
    available_vintages: [2020]
    default_vintage: 2020
    geometry_roles: [analysis, display]
    notes:
      - Place parent relationships remain intentionally restricted in the current contract.

  - geo_level: zcta
    display_name: ZCTA
    plural_display_name: ZCTAs
    id_shape: 5-digit Census ZCTA code
    hierarchy_rank: 8
    supported_in_mvp: true
    stability_class: decennial
    boundary_authority: Census 2020 ZCTA delineation
    available_vintages: [2020]
    default_vintage: 2020
    geometry_roles: [analysis, display]
    notes:
      - A ZCTA is not a USPS ZIP code. Census ZCTA relationships and USPS ZIP
        relationships use different tables and must not be joined by label alone.

  - geo_level: zip
    display_name: USPS ZIP Code
    plural_display_name: USPS ZIP Codes
    id_shape: 5-digit USPS ZIP code
    hierarchy_rank: 8
    supported_in_mvp: false
    stability_class: continuous
    boundary_authority: USPS, distributed by HUD USPS ZIP Crosswalk Files
    available_vintages: [2025]
    default_vintage: 2025
    geometry_roles: []
    notes:
      - Operational delivery geography, not an areal Census geography.
      - It has allocation edges only and no ZIP geometry in this engine.

  - geo_level: tract
    display_name: Census Tract
    plural_display_name: Census Tracts
    id_shape: 11-digit tract GEOID
    hierarchy_rank: 9
    supported_in_mvp: true
    stability_class: decennial
    boundary_authority: Census TIGER/Line / 2020 Census tabulation geography
    available_vintages: [2010, 2020]
    default_vintage: 2020
    geometry_roles: [analysis, display]
    notes:
      - Tract-to-county mapping is exact in the TIGER-based crosswalk.

  - geo_level: tx_isd
    display_name: Texas School District
    plural_display_name: Texas School Districts
    id_shape: NCES district identifier
    hierarchy_rank: 10
    supported_in_mvp: false
    stability_class: periodic
    boundary_authority: Texas Education Agency
    available_vintages: []
    default_vintage: null
    geometry_roles: []
    notes:
      - Specialized education geography used by `gold.tx_isd_metrics`.
      - Not part of the default national geography hierarchy.

hierarchy_edges:
  - child_geo_level: county
    parent_geo_level: state
    relationship_type: exact
    source_table: silver.xwalk_county_state
    valid_for_rollup: true

  - child_geo_level: state
    parent_geo_level: division
    relationship_type: exact
    source_table: silver.xwalk_state_region
    valid_for_rollup: true

  - child_geo_level: state
    parent_geo_level: region
    relationship_type: exact
    source_table: silver.xwalk_state_region
    valid_for_rollup: true

  - child_geo_level: division
    parent_geo_level: region
    relationship_type: exact
    source_table: silver.xwalk_state_region
    valid_for_rollup: true

  - child_geo_level: tract
    parent_geo_level: county
    relationship_type: exact
    source_table: silver.xwalk_tract_county
    valid_for_rollup: true

  - child_geo_level: county
    parent_geo_level: cbsa
    relationship_type: exact_subset
    source_table: silver.xwalk_cbsa_county
    valid_for_rollup: true
    caveat: Counties outside a CBSA have no parent CBSA row.

  - child_geo_level: zip
    parent_geo_level: county
    relationship_type: weighted_many_to_many
    source_table: silver.xwalk_zip_county
    valid_for_rollup: false
    caveat: Pending Census ZCTA relationships. The current compatibility view is a HUD-USPS ZIP allocation and is not a ZCTA edge.

  - child_geo_level: zip
    parent_geo_level: cbsa
    relationship_type: weighted_many_to_many
    source_table: silver.xwalk_zip_cbsa
    valid_for_rollup: false
    caveat: Pending Census ZCTA relationships. The current compatibility view is a HUD-USPS ZIP allocation and is not a ZCTA edge.

  - child_geo_level: zip
    parent_geo_level: tract
    relationship_type: weighted_many_to_many
    source_table: silver.xwalk_zip_tract
    valid_for_rollup: false
    caveat: Pending Census ZCTA relationships. The current compatibility view is a HUD-USPS ZIP allocation and is not a ZCTA edge.

valid_rollup_paths:
  - path: [tract, county, state, division, region, us]
    status: approved
    notes: Exact rollup path for tract-based analyses.

  - path: [county, state, division, region, us]
    status: approved
    notes: Exact rollup path for county-based analyses.

  - path: [county, cbsa]
    status: approved_with_subset_caveat
    notes: Exact only for counties assigned to a CBSA.

  - path: [state, division, region, us]
    status: approved
    notes: Exact Census hierarchy path.

  - path: [cbsa]
    status: terminal
    notes: No exact parent hierarchy is currently approved above CBSA.

invalid_or_restricted_rollups:
  - path: [zip, cbsa]
    reason: HUD-USPS weighted many-to-many allocation; basis selection is required.

  - path: [zip, county]
    reason: HUD-USPS weighted many-to-many allocation; basis selection is required.

  - path: [zip, tract]
    reason: HUD-USPS weighted many-to-many allocation; basis selection is required.

  - path: [zcta, cbsa]
    reason: Census ZCTA allocation is governed from tract to ZCTA; reverse or downstream rollups require an explicit basis and metric-safe aggregation.

  - path: [zcta, county]
    reason: Census ZCTA allocation is governed from tract to ZCTA; reverse or downstream rollups require an explicit basis and metric-safe aggregation.

  - path: [zcta, tract]
    reason: Census ZCTA allocation is governed from tract to ZCTA; reverse or downstream rollups require an explicit basis and metric-safe aggregation.

  - path: [place, county]
    reason: No approved place-to-county hierarchy is cataloged yet.

  - path: [place, state]
    reason: No approved place-to-state hierarchy is cataloged yet.

  - path: [cbsa, state]
    reason: CBSAs can cross state lines, so direct rollup is not exact.

  - path: [tx_isd, county]
    reason: No normalized district-to-county hierarchy is approved in the core semantic layer.

relationship_contracts:
  - source_geo_level: tract
    target_geo_level: county
    relationship_type: containment
    direction: up
    boundary_vintage: 2020
    status: planned_governed_rebuild

  - source_geo_level: county
    target_geo_level: cbsa
    relationship_type: containment
    direction: up
    boundary_vintage: 2023
    status: planned_governed_rebuild
    caveat: A county can be outside every CBSA.

  - source_geo_level: tract
    target_geo_level: place
    relationship_type: allocation
    bases: [population, housing_units, land_area]
    status: governed

  - source_geo_level: tract
    target_geo_level: zcta
    relationship_type: allocation
    bases: [population, housing_units, land_area]
    status: governed

  - source_geo_level: zip
    target_geo_level: tract
    relationship_type: allocation
    bases: [residential_addresses, business_addresses, total_addresses]
    status: existing_rename_pending

  - source_geo_level: tract
    target_geo_level: tract
    relationship_type: temporal
    from_boundary_vintage: 2010
    to_boundary_vintage: 2020
    bases: [population, housing_units, land_area]
    status: governed
