[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-engine"
version = "0.1.0"
description = "Theme-swappable, spec-driven chart rendering engine"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "altair",
    "python-frontmatter",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["chart_engine*"]

[tool.setuptools.package-data]
chart_engine = ["chart_specs/*.md"]
