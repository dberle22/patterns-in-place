# Chart Engine question backlog.
# Canonical copy for the Chart Engine queue lives here.
# Legacy references under publisher/publisher/ are retired and should point here.
#
# Schema:
#   id              — sequential, never reused
#   question        — plain-language question as written to the agent
#   template_id     — controls chart type selection via chart_rules.yml
#                     ranking | trend | compare_selected | distribution | benchmark |
#                     growth | correlation | composition | map | demographic | rank_change
#   geo_level       — cbsa | state | national | county
#   status          — ready | ran | reviewed | posted
#   platform        — both | x | bluesky | substack
#   produce_alternatives — if true, also render fallback chart type as chart_alt.png
#   notes           — agent hints: filters, named geographies, benchmark source,
#                     chart variant override, data caveats
#   scheduled       — ISO date or null
#   ran_at          — ISO datetime set by queue_manager on status → ran
#   posted_at       — ISO datetime set by queue_manager on status → posted

